<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-slate-100 transition-colors">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const RechartsLib = window.Recharts || {};
        const {
            BarChart = () => null,
            Bar = () => null,
            XAxis = () => null,
            YAxis = () => null,
            CartesianGrid = () => null,
            Tooltip = () => null,
            Legend = () => null,
            ResponsiveContainer = ({ children }) => <div className="w-full h-full">{children}</div>
        } = RechartsLib;

        const EXAM_DATE = new Date("2027-03-14T08:00:00");

        const formatDateBR = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        };

        const SQUARE_COLORS = [
            { bg: "bg-amber-50/95 dark:bg-amber-950/50", border: "border-amber-400 dark:border-amber-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-amber-500 text-slate-950" },
            { bg: "bg-sky-50/95 dark:bg-sky-950/50", border: "border-sky-400 dark:border-sky-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-sky-600 text-white" },
            { bg: "bg-rose-50/95 dark:bg-rose-950/50", border: "border-rose-400 dark:border-rose-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-rose-600 text-white" },
            { bg: "bg-emerald-50/95 dark:bg-emerald-950/50", border: "border-emerald-400 dark:border-emerald-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-emerald-600 text-white" },
            { bg: "bg-purple-50/95 dark:bg-purple-950/50", border: "border-purple-400 dark:border-purple-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-purple-600 text-white" },
            { bg: "bg-orange-50/95 dark:bg-orange-950/50", border: "border-orange-400 dark:border-orange-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-orange-600 text-white" },
            { bg: "bg-teal-50/95 dark:bg-teal-950/50", border: "border-teal-400 dark:border-teal-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-teal-600 text-white" },
            { bg: "bg-indigo-50/95 dark:bg-indigo-950/50", border: "border-indigo-400 dark:border-indigo-600", text: "text-slate-900 dark:text-slate-100", badge: "bg-indigo-600 text-white" }
        ];

        const DEFAULT_IMPEDIMENTO_HTML = [
            `<div><b>CAPÍTULO II - DOS IMPEDIMENTOS E DA SUSPEIÇÃO</b></div>`,
            `<div><b>Art. 144.</b> Há <span style="background-color:#fde047;color:#000;padding:0 3px;border-radius:2px;"><b>impedimento</b></span> do juiz, sendo-lhe <u>vedado</u> exercer suas funções no processo:</div>`,
            `<div>I - em que <span style="background-color:#bbf7d0;color:#000;padding:0 2px;">interveio</span> como <span style="background-color:#fde047;color:#000;padding:0 2px;">mandatário da parte</span>, <span style="background-color:#bbf7d0;color:#000;padding:0 2px;">oficiou</span> como <span style="background-color:#fde047;color:#000;padding:0 2px;">perito</span>, <span style="background-color:#bbf7d0;color:#000;padding:0 2px;">funcionou</span> como <span style="background-color:#fde047;color:#000;padding:0 2px;">membro do Ministério Público</span> ou <span style="background-color:#bbf7d0;color:#000;padding:0 2px;">prestou</span> <span style="background-color:#fde047;color:#000;padding:0 2px;">depoimento como testemunha</span>;</div>`,
            `<div>II - de que <span style="background-color:#fde047;color:#000;padding:0 2px;">conheceu em outro grau de jurisdição</span>, <span style="background-color:#fde047;color:#000;padding:0 2px;">tendo proferido decisão</span>;</div>`,
            `<div>III - quando nele <span style="background-color:#bbf7d0;color:#000;padding:0 2px;">estiver postulando</span>, como <span style="background-color:#fde047;color:#000;padding:0 2px;">defensor público</span>, <span style="background-color:#fde047;color:#000;padding:0 2px;">advogado</span> ou <span style="background-color:#fde047;color:#000;padding:0 2px;">membro do Ministério Público</span>, seu cônjuge ou companheiro, ou qualquer parente, consanguíneo ou afim, em linha reta ou colateral, <u><span style="background-color:#fde047;color:#000;padding:0 2px;">até o terceiro grau, inclusive</span></u>;</div>`,
            `<div>IV - <span style="background-color:#fde047;color:#000;padding:0 2px;">quando for parte no processo</span> ele próprio, seu cônjuge ou companheiro, ou parente, consanguíneo ou afim, em linha reta ou colateral, <u><span style="background-color:#fde047;color:#000;padding:0 2px;">até o terceiro grau</span></u>, inclusive;</div>`,
            `<div>V - quando for <span style="background-color:#fde047;color:#000;padding:0 2px;">sócio</span> ou <span style="background-color:#fde047;color:#000;padding:0 2px;">membro de direção</span> ou <span style="background-color:#fde047;color:#000;padding:0 2px;">de administração</span> de <span style="background-color:#fde047;color:#000;padding:0 2px;">pessoa jurídica parte no processo</span>;</div>`,
            `<div>VI - quando for <span style="background-color:#fde047;color:#000;padding:0 2px;">herdeiro presuntivo</span>, <span style="background-color:#fde047;color:#000;padding:0 2px;">donatário</span> ou <span style="background-color:#fde047;color:#000;padding:0 2px;">empregador de qualquer das partes</span>;</div>`,
            `<div>VII - em que figure como <span style="background-color:#fde047;color:#000;padding:0 2px;">parte instituição de ensino</span> com a qual tenha <span style="background-color:#fde047;color:#000;padding:0 2px;">relação de emprego</span> ou <span style="background-color:#fde047;color:#000;padding:0 2px;">decorrente de contrato de prestação de serviços</span>;</div>`,
            `<div><s>VIII - em que figure como parte cliente do escritório de advocacia de seu cônjuge, companheiro ou parente, consanguíneo ou afim, em linha reta ou colateral, até o terceiro grau, inclusive, mesmo que patrocinado por advogado de outro escritório;</s> <b style="color:#1d4ed8;">(ADI nº 5.953);</b></div>`,
            `<div>IX - quando <span style="background-color:#fde047;color:#000;padding:0 2px;">promover ação contra a parte ou seu advogado.</span></div>`
        ].join("");

        function RichTextEditor({ value, onChange, placeholder, minHeight = "110px" }) {
            const editorRef = useRef(null);
            const isInternalChange = useRef(false);

            useEffect(() => {
                if (editorRef.current && !isInternalChange.current) {
                    if (editorRef.current.innerHTML !== (value || '')) {
                        editorRef.current.innerHTML = value || '';
                    }
                }
                isInternalChange.current = false;
            }, [value]);

            const handleInput = () => {
                if (editorRef.current) {
                    isInternalChange.current = true;
                    onChange(editorRef.current.innerHTML);
                }
            };

            const execCmd = (command, arg = null) => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                document.execCommand(command, false, arg);
                handleInput();
            };

            const applyHighlight = (bgColor) => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                if (bgColor !== 'transparent') {
                    document.execCommand('foreColor', false, '#000000');
                }
                document.execCommand('hiliteColor', false, bgColor);
                handleInput();
            };

            return (
                <div className="border-2 border-amber-400 dark:border-amber-600 rounded-xl overflow-hidden bg-white dark:bg-slate-900 shadow-sm">
                    <div className="flex flex-wrap items-center gap-1 p-1.5 bg-amber-100/90 dark:bg-slate-800 border-b border-amber-300 dark:border-slate-700 text-xs">
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('bold'); }} className="px-2 py-1 rounded bg-white dark:bg-slate-700 hover:bg-amber-200 font-black border border-slate-300 dark:border-slate-600" title="Negrito">B</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('italic'); }} className="px-2 py-1 rounded bg-white dark:bg-slate-700 hover:bg-amber-200 italic font-serif font-bold border border-slate-300 dark:border-slate-600" title="Itálico">I</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('underline'); }} className="px-2 py-1 rounded bg-white dark:bg-slate-700 hover:bg-amber-200 underline font-bold border border-slate-300 dark:border-slate-600" title="Sublinhado">U</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('strikeThrough'); }} className="px-2 py-1 rounded bg-white dark:bg-slate-700 hover:bg-amber-200 line-through font-bold border border-slate-300 dark:border-slate-600" title="Riscado / Tachado">S</button>

                        <span className="h-4 w-[1px] bg-amber-300 dark:bg-slate-600 mx-1"></span>

                        <span className="text-[10px] font-extrabold text-slate-600 dark:text-slate-300 mr-0.5">Grifar:</span>
                        <button type="button" onMouseDown={e => { e.preventDefault(); applyHighlight('#fde047'); }} className="w-5 h-5 rounded border border-amber-500 shadow-sm" style={{ backgroundColor: '#fde047' }} title="Marca-texto Amarelo" />
                        <button type="button" onMouseDown={e => { e.preventDefault(); applyHighlight('#bbf7d0'); }} className="w-5 h-5 rounded border border-emerald-500 shadow-sm" style={{ backgroundColor: '#bbf7d0' }} title="Marca-texto Verde" />
                        <button type="button" onMouseDown={e => { e.preventDefault(); applyHighlight('#fbcfe8'); }} className="w-5 h-5 rounded border border-pink-400 shadow-sm" style={{ backgroundColor: '#fbcfe8' }} title="Marca-texto Rosa" />
                        <button type="button" onMouseDown={e => { e.preventDefault(); applyHighlight('#bae6fd'); }} className="w-5 h-5 rounded border border-sky-400 shadow-sm" style={{ backgroundColor: '#bae6fd' }} title="Marca-texto Azul" />
                        <button type="button" onMouseDown={e => { e.preventDefault(); applyHighlight('transparent'); }} className="px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 text-[10px] font-bold border border-slate-300 dark:border-slate-600" title="Remover Marca-texto">Sem Grifo</button>

                        <span className="h-4 w-[1px] bg-amber-300 dark:bg-slate-600 mx-1"></span>

                        <span className="text-[10px] font-extrabold text-slate-600 dark:text-slate-300 mr-0.5">Letra:</span>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('foreColor', '#dc2626'); }} className="w-5 h-5 rounded bg-white border border-slate-300 font-black text-xs flex items-center justify-center" style={{ color: '#dc2626' }} title="Letra Vermelha">A</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('foreColor', '#1d4ed8'); }} className="w-5 h-5 rounded bg-white border border-slate-300 font-black text-xs flex items-center justify-center" style={{ color: '#1d4ed8' }} title="Letra Azul">A</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('foreColor', '#15803d'); }} className="w-5 h-5 rounded bg-white border border-slate-300 font-black text-xs flex items-center justify-center" style={{ color: '#15803d' }} title="Letra Verde">A</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('foreColor', '#7e22ce'); }} className="w-5 h-5 rounded bg-white border border-slate-300 font-black text-xs flex items-center justify-center" style={{ color: '#7e22ce' }} title="Letra Roxa">A</button>
                        <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('removeFormat'); }} className="px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 text-[10px] font-bold border border-slate-300 dark:border-slate-600 ml-auto" title="Limpar formatação">Limpar</button>
                    </div>

                    <div
                        ref={editorRef}
                        contentEditable
                        onInput={handleInput}
                        style={{ minHeight }}
                        data-placeholder={placeholder}
                        className="p-2.5 outline-none compact-rich-text text-slate-900 dark:text-slate-100 max-h-64 overflow-y-auto custom-scrollbar"
                    />
                </div>

        const playBeep = () => {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = new AudioContextClass();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        };

            const updateSubjectMemorizeNotes = (dayId, subIdx, htmlContent) => {
                setDays(prev => prev.map(d => {
                    if (d.id !== dayId) return d;
                    const updatedSubs = [...d.subjects];
                    updatedSubs[subIdx] = { ...updatedSubs[subIdx], memorizeNotes: htmlContent };
                    return { ...d, subjects: updatedSubs };
                }));
            };

            const clearSubjectSquare = (dayId, subIdx) => {
                updateSubjectMemorizeNotes(dayId, subIdx, '');
                showToast(`Quadrado removido.`);
            };

            const toggleMemorizedKey = (key) => {
                setMemorizedKeys(prev => ({ ...prev, [key]: !prev[key] }));
                markDailyProgress();
            };

            const toggleReviewScheduled = (dayId) => {
                setDays(prev => prev.map(d => d.id === dayId ? { ...d, reviewScheduled: !d.reviewScheduled } : d));
            };

            const toggleEditalCheck = (discIdx, topicIdx, field) => {
                setEdital(prev => {
                    const copy = [...prev];
                    const disc = { ...copy[discIdx] };
                    const topics = [...disc.topics];
                    topics[topicIdx] = { ...topics[topicIdx], [field]: !topics[topicIdx][field] };
                    disc.topics = topics;
                    copy[discIdx] = disc;
                    return copy;
                });
                markDailyProgress();
            };

            const allMemorizeSquares = useMemo(() => {
                const squares = [];
                days.forEach(day => {
                    day.subjects.forEach((sub, sIdx) => {
                        if (!sub.memorizeNotes) return;
                        const stripped = sub.memorizeNotes.replace(/<[^>]*>/g, '').trim();
                        if (stripped === '') return;

                        const key = `day_${day.id}_sub_${sIdx}`;
                        const hasHtmlTags = /<[a-z][\s\S]*>/i.test(sub.memorizeNotes);
                        const formattedHtml = hasHtmlTags 
                            ? sub.memorizeNotes 
                            : sub.memorizeNotes.split('\n').map(l => `<div>${l}</div>`).join('');

                        squares.push({
                            id: key,
                            dayId: day.id,
                            subIdx: sIdx,
                            week: day.week,
                            dayOfWeek: day.dayOfWeek,
                            cycleLabel: day.cycleLabel,
                            subjectName: sub.name,
                            rawHtml: formattedHtml,
                            plainText: sub.memorizeNotes.replace(/<[^>]*>/g, ' '),
                            memorized: !!memorizedKeys[key]
                        });
                    });
                });
                return squares;
            }, [days, memorizedKeys]);

            const filteredSquares = useMemo(() => {
                if (!searchKeywordQuery.trim()) return allMemorizeSquares;
                const q = searchKeywordQuery.toLowerCase();
                return allMemorizeSquares.filter(item => 
                    item.plainText.toLowerCase().includes(q) || 
                    item.subjectName.toLowerCase().includes(q) ||
                    `dia ${item.dayId}`.includes(q)
                );
            }, [allMemorizeSquares, searchKeywordQuery]);

            const memorizeStats = useMemo(() => {
                const total = allMemorizeSquares.length;
                const memorized = allMemorizeSquares.filter(s => s.memorized).length;
                const pct = total > 0 ? Math.round((memorized / total) * 100) : 0;
                return { total, memorized, pct };
            }, [allMemorizeSquares]);

            const handleAddSimulado = () => {
                const cB1 = parseInt(newSimulado.correctB1, 10) || 0;
                const cB2 = parseInt(newSimulado.correctB2, 10) || 0;
                const cB3 = parseInt(newSimulado.correctB3, 10) || 0;
                const rNota = parseFloat(newSimulado.redacaoNota) || 0;

                const total = Number(newSimulado.bloco1) + Number(newSimulado.bloco2) + Number(newSimulado.bloco3);
                const totalCorrect = cB1 + cB2 + cB3;

                const sim = {
                    id: Date.now(),
                    date: newSimulado.date,
                    total: total || 70,
                    correct: totalCorrect,
                    bloco1Acertos: cB1,
                    bloco2Acertos: cB2,
                    bloco3Acertos: cB3,
                    redacaoNota: rNota,
                    time: newSimulado.time,
                    notes: newSimulado.notes
                };

                setSimulados(prev => [...prev, sim]);
                setIsSimuladoModalOpen(false);
                setNewSimulado({ 
                    date: new Date().toISOString().split('T')[0], 
                    bloco1: 16, bloco2: 30, bloco3: 24, 
                    correctB1: '', correctB2: '', correctB3: '', redacaoNota: '', time: '4h 30m', notes: '' 
                });
                showToast("Simulado registrado com sucesso!");
            };

            const handleDeleteSimulado = (id) => {
                setSimulados(prev => prev.filter(s => s.id !== id));
                showToast("Simulado removido.");
            };

            const handleAddRedacao = () => {
                if (!newRedacao.theme.trim()) return showToast("Preencha o tema da redação.");
                setRedacoes(prev => [...prev, { ...newRedacao, id: Date.now() }]);
                setIsRedacaoModalOpen(false);
                setNewRedacao({ date: new Date().toISOString().split('T')[0], theme: '', time: '', status: 'planejada', notes: '' });
                showToast("Redação adicionada!");
            };

            const toggleRedacaoStatus = (id) => {
                setRedacoes(prev => prev.map(r => r.id === id ? { ...r, status: r.status === 'planejada' ? 'concluida' : 'planejada' } : r));
            };

            const handleDeleteRedacao = (id) => {
                setRedacoes(prev => prev.filter(r => r.id !== id));
                showToast("Redação removida.");
            };

            const exportBackup = () => {
                const data = { days, edital, memorizedKeys, simulados, redacoes, streak };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `backup_tjsp_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Backup baixado com sucesso!");
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.days) setDays(parsed.days);
                        if (parsed.edital) setEdital(parsed.edital);
                        if (parsed.memorizedKeys) setMemorizedKeys(parsed.memorizedKeys);
                        if (parsed.simulados) setSimulados(parsed.simulados);
                        if (parsed.redacoes) setRedacoes(parsed.redacoes);
                        if (parsed.streak) setStreak(parsed.streak);
                        showToast("Dados restaurados com sucesso!");
                    } catch (err) {
                        showToast("Arquivo de backup inválido.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // Permite importar o mesmo arquivo novamente se necessário
            };

            const handleDriveLogin = (action) => {
                if (!gdriveClientId) {
                    showToast("Insira o seu Client ID do Google primeiro.");
                    return;
                }
                try {
                    const client = google.accounts.oauth2.initTokenClient({
                        client_id: gdriveClientId,
                        scope: 'https://www.googleapis.com/auth/drive.file',
                        callback: (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                setDriveToken(tokenResponse.access_token);
                                if (action === 'save') saveToDrive(tokenResponse.access_token);
                                if (action === 'load') loadFromDrive(tokenResponse.access_token);
                            }
                        },
                    });
                    client.requestAccessToken();
                } catch (error) {
                    showToast("Erro com o Google. Verifique o Client ID e a URL.");
                }
            };

            const saveToDrive = async (token) => {
                showToast("Salvando no Google Drive...");
                try {
                    const q = encodeURIComponent("name = 'backup_tjsp_escrevente.json' and trashed = false");
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const data = await res.json();
                    let fileId = data.files && data.files.length > 0 ? data.files[0].id : null;

                    if (!fileId) {
                        const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                            method: 'POST',
                            headers: { 
                                Authorization: `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ name: 'backup_tjsp_escrevente.json', mimeType: 'application/json' })
                        });
                        const createData = await createRes.json();
                        fileId = createData.id;
                    }

                    if (!fileId) throw new Error("Não foi possível criar o arquivo.");

                    const fileContent = JSON.stringify({ days, edital, memorizedKeys, simulados, redacoes, streak });
                    const uploadRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                        method: 'PATCH',
                        headers: { 
                            Authorization: `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: fileContent
                    });
                    
                    if (uploadRes.ok) showToast("✅ Salvo no Google Drive com sucesso!");
                    else showToast("❌ Erro ao fazer upload do conteúdo.");
                } catch (err) {
                    showToast("❌ Falha na conexão com o Drive.");
                }
            };

            const loadFromDrive = async (token) => {
                showToast("Carregando do Google Drive...");
                try {
                    const q = encodeURIComponent("name = 'backup_tjsp_escrevente.json' and trashed = false");
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const data = await res.json();
                    
                    if (data.files && data.files.length > 0) {
                        const fileId = data.files[0].id;
                        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        const parsed = await fileRes.json();
                        
                        if (parsed.days) setDays(parsed.days);
                        if (parsed.edital) setEdital(parsed.edital);
                        if (parsed.memorizedKeys) setMemorizedKeys(parsed.memorizedKeys);
                        if (parsed.simulados) setSimulados(parsed.simulados);
                        if (parsed.redacoes) setRedacoes(parsed.redacoes);
                        if (parsed.streak) setStreak(parsed.streak);
                        
                        showToast("✅ Dados restaurados do Google Drive!");
                    } else {
                        showToast("ℹ️ Nenhum backup encontrado no seu Drive.");
                    }
                } catch (err) {
                    showToast("❌ Erro ao ler dados do Drive.");
                }
            };

            const stats = useMemo(() => {
                let totalTasks = 0, doneTasks = 0, fullDays = 0;
                let c1Total = 0, c1Done = 0, c2Total = 0, c2Done = 0;
                let totalQuestions = 0, totalCorrect = 0;
                const bySubject = {};

                days.forEach(d => {
                    let dayDone = 0;
                    d.subjects.forEach(s => {
                        totalTasks++;
                        if (d.cycle === 1) { c1Total++; if (s.done) c1Done++; }
                        else { c2Total++; if (s.done) c2Done++; }

                        if (s.done) { doneTasks++; dayDone++; }

                        if (s.questions) {
                            const c = s.questions.correct || 0;
                            const w = s.questions.wrong || 0;
                            totalCorrect += c;
                            totalQuestions += (c + w);
                            if (c > 0 || w > 0) {
                                if (!bySubject[s.name]) bySubject[s.name] = { name: s.name, Acertos: 0, Erros: 0, total: 0 };
                                bySubject[s.name].Acertos += c;
                                bySubject[s.name].Erros += w;
                                bySubject[s.name].total += (c + w);
                            }
                        }
                    });
                    if (d.subjects.length > 0 && dayDone === d.subjects.length) fullDays++;
                });

                const questionChartData = Object.values(bySubject).sort((a,b) => b.total - a.total);
                const globalAccuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
                const c1Pct = c1Total > 0 ? Math.round((c1Done / c1Total) * 100) : 0;
                const c2Pct = c2Total > 0 ? Math.round((c2Done / c2Total) * 100) : 0;

                return { totalTasks, doneTasks, fullDays, c1Pct, c2Pct, totalQuestions, totalCorrect, globalAccuracy, questionChartData };
            }, [days]);

            const editalProgress = useMemo(() => {
                let totalItems = 0, completedChecks = 0;
                edital.forEach(d => {
                    d.topics.forEach(t => {
                        totalItems += 4;
                        if (t.teoria) completedChecks++;
                        if (t.lei) completedChecks++;
                        if (t.questoes) completedChecks++;
                        if (t.revisao) completedChecks++;
                    });
                });
                return totalItems > 0 ? Math.round((completedChecks / totalItems) * 100) : 0;
            }, [edital]);

            const pendingErrorsCount = useMemo(() => {
                return days.filter(d => d.pendingNotes && d.pendingNotes.trim() !== '' && !d.reviewScheduled).length;
            }, [days]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const filteredDays = useMemo(() => {
                let list = days;
                if (cycleFilter === '1') list = list.filter(d => d.cycle === 1);
                if (cycleFilter === '2') list = list.filter(d => d.cycle === 2);
                if (selectedWeekFilter !== 'Todas') list = list.filter(d => d.week === selectedWeekFilter);
                return list;
            }, [days, cycleFilter, selectedWeekFilter]);

            const currentQuickSub = useMemo(() => {
                const [dId, sIdx] = quickSubjectKey.split('-');
                const day = days.find(d => d.id === Number(dId));
                if (day && day.subjects[Number(sIdx)]) return { dayId: day.id, subIdx: Number(sIdx), note: day.subjects[Number(sIdx)].memorizeNotes };
                return null;
            }, [days, quickSubjectKey]);

            return (
                <div 
                    className="flex flex-col h-screen overflow-hidden relative"
                    style={{ 
                        backgroundImage: "url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg/1920px-Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg')", 
                        backgroundSize: 'cover', 
                        backgroundPosition: 'center',
                        backgroundAttachment: 'fixed'
                    }}
                >
                    <div className="absolute inset-0 bg-slate-100/90 dark:bg-slate-950/92 backdrop-blur-[2px] z-0"></div>

                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-xl transition-all">
                            {toastMessage}
                        </div>
                    )}

                    <div className="relative z-10 flex flex-col h-full w-full">
                        <header className="flex justify-between items-center px-3 sm:px-6 py-3 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200 dark:border-darkBorder shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-base shadow-md">TJ</div>
                                <div>
                                    <h1 className="text-sm sm:text-base font-bold text-slate-800 dark:text-white leading-tight">Organizador Escrevente TJ-SP</h1>
                                    <p className="text-[11px] text-slate-500 dark:text-slate-400">
                                        Prova: <strong>14/03/2027</strong> • <span className="text-indigo-600 dark:text-indigo-400 font-bold">Faltam {daysUntilExam} dias</span>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-700">
                                    <span className="font-mono text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100">{formatTime(timeLeft)}</span>
                                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="text-xs font-bold text-indigo-600 dark:text-indigo-400">
                                        {isTimerRunning ? "Pausar" : "Iniciar"}
                                    </button>
                                    <button onClick={() => { setIsTimerRunning(false); setTimeLeft(50 * 60); }} className="text-xs text-slate-400 hover:text-rose-500">↺</button>
                                </div>

                                <div className="flex items-center gap-1 text-amber-500 font-extrabold text-xs sm:text-sm" title="Dias seguidos">
                                    🔥 <span>{streak.count}</span>
                                </div>

                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                                    {isDarkMode ? "☀️" : "🌙"}
                                </button>
                            </div>
                        </header>

                        <div className="bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-b border-slate-200 dark:border-darkBorder px-3 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto custom-scrollbar shrink-0">
                            <button onClick={() => setActiveTab('dashboard')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>📊 Visão Geral</button>
                            <button onClick={() => setActiveTab('cronograma')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'cronograma' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>📅 Cronograma (132 Dias)</button>
                            <button onClick={() => setActiveTab('memorizacao')} className={`px-3.5 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all flex items-center gap-1.5 ${activeTab === 'memorizacao' ? 'bg-amber-500 text-slate-950 shadow-md scale-[1.02]' : 'bg-amber-100 dark:bg-amber-950/60 text-amber-900 dark:text-amber-300 border border-amber-300 dark:border-amber-700 hover:bg-amber-200'}`}>🎨 Quadrados de Memorização ({allMemorizeSquares.length} Dias)</button>
                            <button onClick={() => setActiveTab('revisoes')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${activeTab === 'revisoes' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>🧠 Caderno de Erros {pendingErrorsCount > 0 && <span className="px-1.5 py-0.5 rounded-full bg-rose-500 text-white text-[10px]">{pendingErrorsCount}</span>}</button>
                            <button onClick={() => setActiveTab('edital')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'edital' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>📋 Edital Verticalizado ({editalProgress}%)</button>
                            <button onClick={() => setActiveTab('simulados')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'simulados' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>📝 Simulados</button>
                            <button onClick={() => setActiveTab('redacoes')} className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'redacoes' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>✍️ Redações</button>
                        </div>

                        <main className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6">
                            
                            {activeTab === 'dashboard' && (
                                <div className="max-w-6xl mx-auto space-y-6">
                                    <header className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3">
                                        <div>
                                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Painel de Evolução 🎯</h2>
                                            <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Acompanhe suas duas voltas pelo edital, questões e quadrados de memorização por dia.</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={exportBackup} className="px-3 py-1.5 bg-white dark:bg-darkCard border border-slate-200 dark:border-darkBorder rounded-xl text-xs font-bold hover:bg-slate-50">⬇ Backup Local</button>
                                            <button onClick={() => fileInputRef.current.click()} className="px-3 py-1.5 bg-white dark:bg-darkCard border border-slate-200 dark:border-darkBorder rounded-xl text-xs font-bold hover:bg-slate-50">⬆ Restaurar Local</button>
                                            <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
                                        </div>
                                    </header>

                                    <div className="bg-white/90 dark:bg-darkCard/90 p-4 sm:p-5 rounded-2xl border border-blue-200 dark:border-blue-900 shadow-sm space-y-3">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-blue-600 text-lg">☁️</div>
                                                <div>
                                                    <h3 className="text-sm font-bold text-slate-800 dark:text-white">Sincronização com Google Drive</h3>
                                                    <p className="text-[11px] text-slate-500">Salve seus dados na sua conta do Google para acessar no celular ou outro PC.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2 w-full sm:w-auto">
                                                <button onClick={() => handleDriveLogin('save')} className="flex-1 sm:flex-none px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-blue-700">
                                                    ☁️ Salvar no Drive
                                                </button>
                                                <button onClick={() => handleDriveLogin('load')} className="flex-1 sm:flex-none px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold shadow-sm hover:bg-slate-200 dark:hover:bg-slate-700">
                                                    ⬇ Carregar
                                                </button>
                                            </div>
                                        </div>
                                        <div className="pt-3 border-t border-slate-200 dark:border-slate-800">
                                            <div className="flex items-center gap-2 mb-2">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Google Client ID:</label>
                                                <input 
                                                    type="password" 
                                                    placeholder="Cole aqui o seu Client ID..." 
                                                    value={gdriveClientId}
                                                    onChange={e => setGdriveClientId(e.target.value)}
                                                    className="flex-1 px-3 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 outline-none focus:border-blue-500"
                                                />
                                            </div>
                                            <details className="text-[11px] text-slate-500 cursor-pointer">
                                                <summary className="font-bold hover:text-blue-600">Como pegar meu Client ID gratuito?</summary>
                                                <ol className="mt-2 pl-4 list-decimal space-y-1 text-slate-600 dark:text-slate-400">
                                                    <li>Acesse o <a href="https://console.cloud.google.com/" target="_blank" className="text-blue-600 underline">Google Cloud Console</a> e crie um novo projeto.</li>
                                                    <li>Vá em <b>APIs e Serviços &gt; Biblioteca</b> e ative a <b>Google Drive API</b>.</li>
                                                    <li>Vá em <b>Tela de Consentimento OAuth</b> e configure como Externo.</li>
                                                    <li>Vá em <b>Credenciais &gt; Criar Credenciais &gt; ID do Cliente OAuth</b> (Tipo: Aplicativo da Web).</li>
                                                    <li>Em "Origens JavaScript autorizadas", adicione o link exato de onde você publicou este site.</li>

                                                                    { key: 'lei', label: 'Lei' },
                                                                    { key: 'questoes', label: 'Questões' },
                                                                    { key: 'revisao', label: 'Revisão' }
                                                                ].map(check => (
                                                                    <button
                                                                        key={check.key}
                                                                        onClick={() => toggleEditalCheck(dIdx, tIdx, check.key)}
                                                                        className={`px-2 py-0.5 rounded text-[10px] font-bold border ${t[check.key] ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white dark:bg-slate-700 border-slate-200 text-slate-500'}`}
                                                                    >
                                                                        {check.label} {t[check.key] ? '✓' : ''}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'simulados' && (
                                <div className="max-w-5xl mx-auto space-y-5">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">📝 Simulados Oficiais (70 Questões)</h2>
                                            <p className="text-xs text-slate-500">Diagnóstico por Bloco conforme o Edital nº 02/2026.</p>
                                        </div>
                                        <button onClick={() => setIsSimuladoModalOpen(true)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">
                                            + Registrar Simulado
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {simulados.map(sim => {
                                            const pct = sim.total > 0 ? Math.round((sim.correct / sim.total) * 100) : 0;
                                            return (
                                                <div key={sim.id} className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-xs font-bold text-indigo-600">{formatDateBR(sim.date)}</span>
                                                        <button onClick={() => handleDeleteSimulado(sim.id)} className="text-xs text-slate-400 hover:text-rose-500">✕</button>
                                                    </div>
                                                    <div className="mt-2 flex items-center justify-between">
                                                        <span className="text-2xl font-black">{sim.correct} <span className="text-xs font-normal text-slate-400">/ {sim.total}</span></span>
                                                        <span className="text-xs font-extrabold px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-700">{pct}%</span>
                                                    </div>
                                                    <div className="mt-3 space-y-1 text-[11px] bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl">
                                                        <div className="flex justify-between"><span>Bloco I (Port.):</span><strong>{sim.bloco1Acertos}/16</strong></div>
                                                        <div className="flex justify-between"><span>Bloco II (Dir.):</span><strong>{sim.bloco2Acertos}/30</strong></div>
                                                        <div className="flex justify-between"><span>Bloco III (Gerais):</span><strong>{sim.bloco3Acertos}/24</strong></div>
                                                        <div className="flex justify-between"><span>Redação:</span><strong>{sim.redacaoNota} pts</strong></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'redacoes' && (
                                <div className="max-w-5xl mx-auto space-y-5">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">✍️ Redações VUNESP (0 a 40 pts)</h2>
                                            <p className="text-xs text-slate-500">Controle os temas praticados e o tempo gasto.</p>
                                        </div>
                                        <button onClick={() => setIsRedacaoModalOpen(true)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">
                                            + Novo Tema
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {redacoes.map(red => (
                                            <div key={red.id} className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-amber-100 text-amber-800">{red.status}</span>
                                                        <button onClick={() => handleDeleteRedacao(red.id)} className="text-xs text-slate-400 hover:text-rose-500">✕</button>
                                                    </div>
                                                    <h3 className="font-bold text-sm mt-2">{red.theme}</h3>
                                                    <p className="text-[11px] text-slate-400 mt-1">Data: {formatDateBR(red.date)} {red.time ? `• Tempo: ${red.time}` : ''}</p>
                                                    {red.notes && <p className="text-xs text-slate-600 mt-2 italic">"{red.notes}"</p>}
                                                </div>
                                                <button onClick={() => toggleRedacaoStatus(red.id)} className="mt-4 w-full py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white">
                                                    {red.status === 'concluida' ? 'Reabrir' : 'Marcar Concluída ✓'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {selectedDayId !== null && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-2xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl border border-slate-200 dark:border-darkBorder">
                                {(() => {
                                    const day = days.find(d => d.id === selectedDayId);
                                    if (!day) return null;

                                    return (
                                        <>
                                            <div className="p-4 border-b border-slate-100 dark:border-darkBorder flex justify-between items-center bg-slate-50 dark:bg-slate-800/40">
                                                <div>
                                                    <span className="text-[11px] font-extrabold uppercase text-indigo-600">
                                                        {day.cycleLabel} • {day.week} ({day.dayOfWeek})
                                                    </span>
                                                    <h3 className="text-lg font-black text-slate-800 dark:text-white">Dia {day.id}</h3>
                                                </div>
                                                <button onClick={() => setSelectedDayId(null)} className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700">✕</button>
                                            </div>

                                            <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                                                <div className="space-y-2.5">
                                                    {day.subjects.map((sub, sIdx) => {
                                                        const q = sub.questions || { correct: 0, wrong: 0 };
                                                        const totalQ = q.correct + q.wrong;
                                                        const pctQ = totalQ > 0 ? Math.round((q.correct / totalQ) * 100) : null;

                                                        return (
                                                            <div key={sIdx} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/40 space-y-2">
                                                                <div className="flex items-start gap-2.5 cursor-pointer" onClick={() => toggleSubjectDone(day.id, sIdx)}>
                                                                    <div className={`w-5 h-5 rounded-md flex items-center justify-center border mt-0.5 shrink-0 ${sub.done ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300'}`}>
                                                                        {sub.done && "✓"}
                                                                    </div>
                                                                    <div>
                                                                        <p className={`text-xs sm:text-sm font-bold ${sub.done ? 'line-through text-slate-400' : ''}`}>{sub.name}</p>
                                                                        <p className="text-[11px] text-slate-500">{sub.topic}</p>
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center gap-3 pt-1 border-t border-slate-200/50">
                                                                    <span className="text-[11px] font-bold text-slate-400">🎯 Questões ({sub.topic.split('(')[0].trim()}):</span>
                                                                    <div className="flex items-center gap-1">
                                                                        <span className="text-[10px] text-emerald-600 font-bold">✓</span>
                                                                        <input 
                                                                            type="number" 
                                                                            placeholder="0" 
                                                                            value={q.correct || ''}
                                                                            onChange={e => updateSubjectQuestions(day.id, sIdx, 'correct', e.target.value)}
                                                                            className="w-12 px-1 py-0.5 text-center text-xs rounded bg-white dark:bg-slate-700 border"
                                                                        />
                                                                    </div>
                                                                    <div className="flex items-center gap-1">
                                                                        <span className="text-[10px] text-rose-500 font-bold">✗</span>
                                                                        <input 
                                                                            type="number" 
                                                                            placeholder="0" 
                                                                            value={q.wrong || ''}
                                                                            onChange={e => updateSubjectQuestions(day.id, sIdx, 'wrong', e.target.value)}
                                                                            className="w-12 px-1 py-0.5 text-center text-xs rounded bg-white dark:bg-slate-700 border"
                                                                        />
                                                                    </div>
                                                                    {pctQ !== null && <span className="text-[10px] font-black text-indigo-600 ml-auto">{pctQ}%</span>}
                                                                </div>

                                                                <div className="mt-2 pt-2 border-t border-slate-200/50">
                                                                    <label className="flex text-[10px] font-black text-amber-900 dark:text-amber-300 uppercase mb-1.5">
                                                                        🎨 Quadrado de Memorização ({sub.name}):
                                                                    </label>
                                                                    <RichTextEditor
                                                                        value={sub.memorizeNotes || ''}
                                                                        onChange={(html) => updateSubjectMemorizeNotes(day.id, sIdx, html)}
                                                                        placeholder={`Cole os artigos e palavras-chave para ${sub.name}...`}
                                                                        minHeight="60px"
                                                                    />
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-rose-600 mb-1">🧠 O que errei / Caderno de Erros deste dia:</label>
                                                    <textarea 
                                                        rows="2" 
                                                        value={day.pendingNotes || ''} 
                                                        onChange={e => updatePendingNotes(day.id, e.target.value)}
                                                        placeholder="Anote aqui o que errou para revisar no Caderno de Erros..." 
                                                        className="w-full p-2.5 rounded-xl border border-rose-200 bg-rose-50/30 dark:bg-slate-800 text-xs outline-none resize-none"
                                                    />
                                                </div>
                                            </div>

                                            <div className="p-3 border-t border-slate-100 dark:border-darkBorder flex justify-between bg-slate-50 dark:bg-slate-800/40">
                                                <button 
                                                    onClick={() => { setSelectedDayId(null); setActiveTab('memorizacao'); }} 
                                                    className="px-3.5 py-1.5 bg-amber-500 text-slate-950 rounded-xl text-xs font-black"
                                                >
                                                    🎨 Ver no Mural de Quadrados
                                                </button>
                                                <button onClick={() => setSelectedDayId(null)} className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">
                                                    Salvar e Fechar
                                                </button>
                                            </div>
                                        </>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {isSimuladoModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl border">
                                <h3 className="text-base font-black">Registrar Simulado (70 Questões)</h3>
                                <div className="space-y-3">
                                    <input type="date" value={newSimulado.date} onChange={e => setNewSimulado({...newSimulado, date: e.target.value})} className="w-full p-2 text-xs rounded-xl border" />
                                    <div className="grid grid-cols-3 gap-2">
                                        <input type="number" placeholder="Port. (16)" value={newSimulado.correctB1} onChange={e => setNewSimulado({...newSimulado, correctB1: e.target.value})} className="p-2 text-xs text-center rounded-lg border font-bold" />
                                        <input type="number" placeholder="Dir. (30)" value={newSimulado.correctB2} onChange={e => setNewSimulado({...newSimulado, correctB2: e.target.value})} className="p-2 text-xs text-center rounded-lg border font-bold" />
                                        <input type="number" placeholder="Gerais (24)" value={newSimulado.correctB3} onChange={e => setNewSimulado({...newSimulado, correctB3: e.target.value})} className="p-2 text-xs text-center rounded-lg border font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" placeholder="Nota Redação (0-40)" value={newSimulado.redacaoNota} onChange={e => setNewSimulado({...newSimulado, redacaoNota: e.target.value})} className="p-2 text-xs rounded-xl border font-bold" />
                                        <input type="text" placeholder="Tempo (ex: 4h 20m)" value={newSimulado.time} onChange={e => setNewSimulado({...newSimulado, time: e.target.value})} className="p-2 text-xs rounded-xl border" />
                                    </div>
                                    <textarea rows="2" placeholder="Observações..." value={newSimulado.notes} onChange={e => setNewSimulado({...newSimulado, notes: e.target.value})} className="w-full p-2 text-xs rounded-xl border resize-none" />
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setIsSimuladoModalOpen(false)} className="px-3 py-1.5 text-xs font-bold">Cancelar</button>
                                    <button onClick={handleAddSimulado} className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isRedacaoModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl border">
                                <h3 className="text-base font-black">Novo Tema de Redação</h3>
                                <div className="space-y-3">
                                    <input type="text" placeholder="Tema da Redação..." value={newRedacao.theme} onChange={e => setNewRedacao({...newRedacao, theme: e.target.value})} className="w-full p-2 text-xs rounded-xl border" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={newRedacao.date} onChange={e => setNewRedacao({...newRedacao, date: e.target.value})} className="p-2 text-xs rounded-xl border" />
                                        <input type="text" placeholder="Tempo (ex: 1h 10m)" value={newRedacao.time} onChange={e => setNewRedacao({...newRedacao, time: e.target.value})} className="p-2 text-xs rounded-xl border" />
                                    </div>
                                    <textarea rows="3" placeholder="Rascunho / Argumentos..." value={newRedacao.notes} onChange={e => setNewRedacao({...newRedacao, notes: e.target.value})} className="w-full p-2 text-xs rounded-xl border resize-none" />
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setIsRedacaoModalOpen(false)} className="px-3 py-1.5 text-xs font-bold">Cancelar</button>
                                    <button onClick={handleAddRedacao} className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
