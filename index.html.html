<body class="bg-gray-50 dark:bg-darkBg text-gray-800 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        // --- GERAÇÃO DE DADOS INICIAIS ---
        const generateBaseDays = () => {
            const daysArray = [
                { id: 1, subjects: [ { name: 'Português', topic: 'Pontuação (16 questões)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Matemática', topic: 'MMC e MDC (04 questões)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'Windows 10 (09 questões)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Dir. Constitucional', topic: 'Art. 5 (30 questões)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Dir. Administrativo', topic: 'Art. 01 ao 45 - Lei 10.261 (25 questões)', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 2, subjects: [ { name: 'Português', topic: 'Concordância Verbal e Nominal', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Rac. Lógico', topic: 'Tabela Verdade', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'Word 365', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Proc. Penal', topic: 'Art. 251 a 258, 261 a 267...', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Dir. Penal', topic: 'Art. 293 ao 305, 307, 308 e 311-A', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 3, subjects: [ { name: 'Português', topic: 'Pronome, Advérbio e Preposição', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Matemática', topic: 'Porcentagem', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'Excel 365', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Proc. Civil', topic: 'Art. 144 ao 155 e 188 ao 217', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 4, subjects: [ { name: 'Português', topic: 'Colocação Pronominal', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Rac. Lógico', topic: 'Negação e Equivalência Lógica', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'Correio Eletrônico e Internet', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Normas da Correg.', topic: 'Art. 05 ao 18, 26 ao 29, 46 ao 79', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Legislação', topic: 'Resolução nº 963 (Eproc)', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 5, subjects: [ { name: 'Português', topic: 'Conjunções', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Matemática', topic: 'Regra de Três Simples e Composta', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'MS Teams, SharePoint, OneDrive', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Proc. Civil', topic: 'Art. 218 ao 275', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 6, subjects: [ { name: 'Redação', topic: 'Treino de Redação (Temas Atuais)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Normas da Correg.', topic: 'Regimento Interno do TJ-SP (Art 1 ao 29-E)', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
                { id: 7, subjects: [ { name: 'Português', topic: 'Regência Verbal e Nominal', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Rac. Lógico', topic: 'Lógica de Argumentação', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Informática', topic: 'Windows 10 (Revisão/Questões)', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Dir. Constitucional', topic: 'Art. 06 ao 13, 37 e 38 da CF', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Dir. Administrativo', topic: 'Art. 46 ao 86 e 171 ao 175 - Lei 10.261', done: false, questions: { correct: 0, wrong: 0 } }, { name: 'Legislação', topic: 'Lei de Improbidade (Art. 01 ao 09)', done: false, questions: { correct: 0, wrong: 0 } } ], pendingNotes: '', reviewScheduled: false },
            ];

            const padroesDeEstudo = [
                [ { name: 'Português', topic: 'Resolução de Questões Vunesp' }, { name: 'Matemática', topic: 'Revisão e Exercícios' }, { name: 'Informática', topic: 'Prática de Questões' }, { name: 'Proc. Penal', topic: 'Leitura de Lei Seca e Questões' }, { name: 'Dir. Penal', topic: 'Leitura de Lei Seca e Questões' } ],
                [ { name: 'Português', topic: 'Resolução de Questões Vunesp' }, { name: 'Rac. Lógico', topic: 'Revisão e Exercícios' }, { name: 'Informática', topic: 'Prática de Questões' }, { name: 'Proc. Civil', topic: 'Leitura de Lei Seca e Questões' } ],
                [ { name: 'Português', topic: 'Resolução de Questões Vunesp' }, { name: 'Matemática', topic: 'Revisão e Exercícios' }, { name: 'Informática', topic: 'Prática de Questões' }, { name: 'Normas da Correg.', topic: 'Leitura e Questões' }, { name: 'Legislação Especial', topic: 'Estatuto PCD / Improbidade / Eproc' } ],
                [ { name: 'Português', topic: 'Resolução de Questões Vunesp' }, { name: 'Rac. Lógico', topic: 'Revisão e Exercícios' }, { name: 'Informática', topic: 'Prática de Questões' }, { name: 'Proc. Civil', topic: 'Leitura de Lei Seca e Questões' } ],
                [ { name: 'Redação', topic: 'Treino Prático (Tema Atual)' }, { name: 'Regimento Interno', topic: 'Leitura e Questões' }, { name: 'Atualidades', topic: 'Leitura de Notícias e Questões' } ],
                [ { name: 'Português', topic: 'Resolução de Questões Vunesp' }, { name: 'Matemática', topic: 'Revisão e Exercícios' }, { name: 'Informática', topic: 'Prática de Questões' }, { name: 'Dir. Constitucional', topic: 'Revisão de Artigos e Questões' }, { name: 'Dir. Administrativo', topic: 'Revisão de Artigos e Questões' } ]
            ];

            for (let i = 8; i <= 120; i++) {
                const indexDoPadrao = (i - 8) % 6;
                const subjectsDoDia = padroesDeEstudo[indexDoPadrao].map(sub => ({
                    name: sub.name, topic: sub.topic, done: false, questions: { correct: 0, wrong: 0 }
                }));
                daysArray.push({ id: i, subjects: subjectsDoDia, pendingNotes: '', reviewScheduled: false });
            }
            return daysArray;
        };

        // --- ÍCONES SVG ---
        const Icons = {

            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>,

            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Flame: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Pen: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            // ESTADOS COM LOCAL STORAGE
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedDayId, setSelectedDayId] = useState(null);
            
            // Estado dos Dias (Guardado Automaticamente)
            const [days, setDays] = useState(() => {
                const saved = localStorage.getItem('tjsp_days_v2');
                if (saved) {
                    try { 
                        // Migration step: ensure all subjects have the questions object
                        const parsedDays = JSON.parse(saved);
                        return parsedDays.map(d => ({
                            ...d,
                            subjects: d.subjects.map(s => ({
                                ...s,
                                questions: s.questions || { correct: 0, wrong: 0 }
                            }))
                        }));
                    } catch (e) { console.error(e); }
                }
                return generateBaseDays();
            });

            // Estado do Modo Escuro
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('tjsp_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });

            // Estado da Ofensiva (Streak)
            const [streak, setStreak] = useState(() => {
                const saved = localStorage.getItem('tjsp_streak');
                return saved ? JSON.parse(saved) : { count: 0, lastDate: null };
            });

            // Estado do Pomodoro
            const [pomodoroMode, setPomodoroMode] = useState('study'); // 'study' ou 'break'
            const [timeLeft, setTimeLeft] = useState(50 * 60); // 50 min inicial
            const [isTimerRunning, setIsTimerRunning] = useState(false);

            // Estado de Edição de Metas
            const [editingMeta, setEditingMeta] = useState(null); // { dayId, subjectIndex, tempName, tempTopic }

            // Estado de Filtro de Revisões
            const [searchQuery, setSearchQuery] = useState('');

            // Estado de Simulados
            const [simulados, setSimulados] = useState(() => {
                const saved = localStorage.getItem('tjsp_simulados');
                return saved ? JSON.parse(saved) : [];
            });
            const [isSimuladoModalOpen, setIsSimuladoModalOpen] = useState(false);
            const [newSimulado, setNewSimulado] = useState({ date: new Date().toISOString().split('T')[0], total: 100, correct: 0, wrong: 0, time: '', notes: '' });

            // Estado de Redações
            const [redacoes, setRedacoes] = useState(() => {
                const saved = localStorage.getItem('tjsp_redacoes');
                return saved ? JSON.parse(saved) : [];
            });
            const [isRedacaoModalOpen, setIsRedacaoModalOpen] = useState(false);
            const [newRedacao, setNewRedacao] = useState({ date: new Date().toISOString().split('T')[0], theme: '', time: '', status: 'planejada', notes: '' });

            // REFERÊNCIAS
            const fileInputRef = useRef(null);

            // --- EFFECTS (Ações Automáticas) ---
            
            // Guardar dias e aplicar classes de modal
            useEffect(() => {
                localStorage.setItem('tjsp_days_v2', JSON.stringify(days));
                if (selectedDayId) document.body.classList.add('modal-open');
                else document.body.classList.remove('modal-open');
            }, [days, selectedDayId]);

            // Guardar e aplicar modo escuro
            useEffect(() => {
                localStorage.setItem('tjsp_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            // Guardar ofensiva
            useEffect(() => {
                localStorage.setItem('tjsp_streak', JSON.stringify(streak));
            }, [streak]);

            // Guardar simulados
            useEffect(() => {
                localStorage.setItem('tjsp_simulados', JSON.stringify(simulados));
            }, [simulados]);

            // Guardar redações
            useEffect(() => {
                localStorage.setItem('tjsp_redacoes', JSON.stringify(redacoes));
            }, [redacoes]);

            // Lógica do Temporizador (Pomodoro)
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((t) => t - 1);
                    }, 1000);
                } else if (timeLeft === 0) {
                    setIsTimerRunning(false);
                    // Alternar modo
                    if (pomodoroMode === 'study') {
                        setPomodoroMode('break');
                        setTimeLeft(10 * 60); // 10 min de pausa
                        alert('Tempo de estudo concluído! Faça uma pausa de 10 minutos.');
                    } else {
                        setPomodoroMode('study');
                        setTimeLeft(50 * 60); // 50 min de estudo
                        alert('Pausa concluída! De volta aos estudos.');
                    }
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timeLeft, pomodoroMode]);

            // --- FUNÇÕES AUXILIARES E AÇÕES ---

            // Atualizar Ofensiva
            const updateStreak = () => {
                const today = new Date().toISOString().split('T')[0];
                setStreak(prev => {
                    if (prev.lastDate === today) return prev; // Já pontuou hoje
                    
                    if (prev.lastDate) {
                        const lastDateObj = new Date(prev.lastDate);
                        const todayObj = new Date(today);
                        const diffTime = Math.abs(todayObj - lastDateObj);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

                        if (diffDays === 1) {
                            return { count: prev.count + 1, lastDate: today }; // Dias seguidos
                        } else if (diffDays > 1) {
                            return { count: 1, lastDate: today }; // Quebrou a ofensiva
                        }
                    }
                    return { count: 1, lastDate: today }; // Primeiro dia
                });
            };

            const toggleSubjectDone = (dayId, subjectIndex) => {
                const newDays = [...days];
                const dayIndex = newDays.findIndex(d => d.id === dayId);
                newDays[dayIndex].subjects[subjectIndex].done = !newDays[dayIndex].subjects[subjectIndex].done;
                setDays(newDays);
                
                // Se marcou como feito, atualiza a ofensiva
                if (newDays[dayIndex].subjects[subjectIndex].done) {
                    updateStreak();
                }
            };

            const updatePendingNotes = (dayId, notes) => {
                const newDays = [...days];
                const dayIndex = newDays.findIndex(d => d.id === dayId);
                newDays[dayIndex].pendingNotes = notes;
                setDays(newDays);
            };

            const toggleReviewStatus = (dayId) => {
                const newDays = [...days];
                const dayIndex = newDays.findIndex(d => d.id === dayId);
                newDays[dayIndex].reviewScheduled = !newDays[dayIndex].reviewScheduled;
                setDays(newDays);
            };

            const saveMetaEdit = () => {
                if (!editingMeta) return;
                const newDays = [...days];
                const dayIndex = newDays.findIndex(d => d.id === editingMeta.dayId);
                newDays[dayIndex].subjects[editingMeta.subjectIndex].name = editingMeta.tempName;
                newDays[dayIndex].subjects[editingMeta.subjectIndex].topic = editingMeta.tempTopic;
                setDays(newDays);
                setEditingMeta(null);
            };

            const updateQuestions = (dayId, subjectIndex, field, value) => {
                const val = value === '' ? 0 : parseInt(value);
                if (isNaN(val) || val < 0) return;

                const newDays = [...days];
                const dayIndex = newDays.findIndex(d => d.id === dayId);
                
                if (!newDays[dayIndex].subjects[subjectIndex].questions) {
                    newDays[dayIndex].subjects[subjectIndex].questions = { correct: 0, wrong: 0 };
                }
                
                newDays[dayIndex].subjects[subjectIndex].questions[field] = val;
                setDays(newDays);
            };

            // Formatação do tempo do Pomodoro
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const resetTimer = () => {
                setIsTimerRunning(false);
                setTimeLeft(pomodoroMode === 'study' ? 50 * 60 : 10 * 60);
            };

            // Funções de Simulados
            const handleAddSimulado = () => {
                const sim = {
                    id: Date.now(),
                    date: newSimulado.date,
                    total: parseInt(newSimulado.total),
                    correct: parseInt(newSimulado.correct),
                    wrong: parseInt(newSimulado.wrong),
                    time: newSimulado.time,
                    notes: newSimulado.notes
                };
                setSimulados([...simulados, sim]);
                setIsSimuladoModalOpen(false);
                setNewSimulado({ date: new Date().toISOString().split('T')[0], total: 100, correct: 0, wrong: 0, time: '', notes: '' });
            };

            const handleDeleteSimulado = (id) => {
                if(confirm("Tem a certeza que deseja excluir este simulado?")) {
                    setSimulados(simulados.filter(s => s.id !== id));
                }
            };

            // Funções de Redações
            const handleAddRedacao = () => {
                if (!newRedacao.theme.trim()) {
                    alert("Por favor, preencha o tema da redação.");
                    return;
                }
                const red = {
                    id: Date.now(),
                    date: newRedacao.date,
                    theme: newRedacao.theme,
                    time: newRedacao.time,
                    status: newRedacao.status,
                    notes: newRedacao.notes
                };
                setRedacoes([...redacoes, red]);
                setIsRedacaoModalOpen(false);
                setNewRedacao({ date: new Date().toISOString().split('T')[0], theme: '', time: '', status: 'planejada', notes: '' });
            };

            const handleDeleteRedacao = (id) => {
                if(confirm("Tem a certeza que deseja excluir esta redação?")) {
                    setRedacoes(redacoes.filter(r => r.id !== id));
                }
            };

            const toggleRedacaoStatus = (id) => {
                setRedacoes(redacoes.map(r => {
                    if (r.id === id) {
                        return { ...r, status: r.status === 'planejada' ? 'concluida' : 'planejada' };
                    }
                    return r;
                }));
            };

            // Exportar e Importar
            const exportData = () => {
                const dataStr = JSON.stringify({ days, streak, simulados, redacoes });
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = 'meu_progresso_tjsp.json';
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            const importData = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const content = JSON.parse(e.target.result);
                        if (content.days) setDays(content.days);
                        if (content.streak) setStreak(content.streak);
                        if (content.simulados) setSimulados(content.simulados);
                        if (content.redacoes) setRedacoes(content.redacoes);
                        alert("Dados importados com sucesso!");
                    } catch (error) {
                        alert("Erro ao ler o ficheiro. Certifique-se que é o ficheiro correto.");
                    }
                };
            };

            // --- ESTATÍSTICAS ---
            const stats = useMemo(() => {
                let totalSubjects = 0;
                let completedSubjects = 0;
                let fullyCompletedDays = 0;
                let daysWithPendingReviews = 0;

                days.forEach(day => {
                    let dayCompletedSubjects = 0;
                    day.subjects.forEach(sub => {
                        totalSubjects++;
                        if (sub.done) {
                            completedSubjects++;
                            dayCompletedSubjects++;
                        }
                    });
                    if (dayCompletedSubjects === day.subjects.length && day.subjects.length > 0) fullyCompletedDays++;
                    if (day.pendingNotes.trim() !== '' && !day.reviewScheduled) daysWithPendingReviews++;
                });

                return {
                    totalSubjects,
                    completedSubjects,
                    progressPercentage: totalSubjects === 0 ? 0 : Math.round((completedSubjects / totalSubjects) * 100),
                    fullyCompletedDays,
                    daysWithPendingReviews
                };
            }, [days]);

            const chartData = useMemo(() => {
                const subjectMap = {};
                days.forEach(day => {
                    day.subjects.forEach(sub => {
                        if (!subjectMap[sub.name]) subjectMap[sub.name] = { name: sub.name, total: 0, done: 0 };
                        subjectMap[sub.name].total++;
                        if (sub.done) subjectMap[sub.name].done++;
                    });
                });
                
                return Object.values(subjectMap).map(item => ({
                    ...item,
                    percentage: Math.round((item.done / item.total) * 100)
                })).sort((a, b) => b.total - a.total).slice(0, 8);
            }, [days]);

            // Estatísticas de Questões (AGRUPADAS POR MATÉRIA)
            const questionStats = useMemo(() => {
                let totalCorrect = 0;
                let totalWrong = 0;
                const bySubject = {};

                days.forEach(day => {
                    day.subjects.forEach(sub => {
                        if (sub.questions) {
                            const c = sub.questions.correct || 0;
                            const w = sub.questions.wrong || 0;
                            totalCorrect += c;
                            totalWrong += w;

                            if (c > 0 || w > 0) {
                                const subjectName = sub.name;
                                // Limpa o nome do tópico removendo textos entre parênteses como "(16 questões)"
                                const topicClean = sub.topic.split('(')[0].trim();

                                if (!bySubject[subjectName]) {
                                    bySubject[subjectName] = { subject: subjectName, topics: {} };
                                }

                                if (!bySubject[subjectName].topics[topicClean]) {
                                    bySubject[subjectName].topics[topicClean] = { name: topicClean, correct: 0, wrong: 0, total: 0 };
                                }

                                bySubject[subjectName].topics[topicClean].correct += c;
                                bySubject[subjectName].topics[topicClean].wrong += w;
                                bySubject[subjectName].topics[topicClean].total += (c + w);
                            }
                        }
                    });
                });

                const totalQuestions = totalCorrect + totalWrong;
                const globalAccuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;

                // Prepara os dados agrupando por matéria
                const groupedData = Object.values(bySubject).map(subjectObj => {
                    const topicsArray = Object.values(subjectObj.topics)
                        .sort((a, b) => b.total - a.total)
                        .map(t => {
                            // Encurta o nome para o eixo X não ficar sobreposto
                            const shortName = t.name.length > 20 ? t.name.substring(0, 20) + '...' : t.name;
                            return {
                                name: t.name, // Nome completo (usado no tooltip)
                                displayName: shortName, // Nome curto (usado no eixo)
                                Acertos: t.correct,
                                Erros: t.wrong,
                                Total: t.total,
                                Accuracy: Math.round((t.correct / t.total) * 100)
                            };
                        });
                    return {
                        subject: subjectObj.subject,
                        topics: topicsArray
                    };
                }).sort((a, b) => a.subject.localeCompare(b.subject)); // Ordem alfabética por matéria

                return { totalCorrect, totalWrong, totalQuestions, globalAccuracy, groupedData, hasData: groupedData.length > 0 };
            }, [days]);

            // Estatísticas dos Simulados
            const simuladoStats = useMemo(() => {
                if (simulados.length === 0) return { avgAccuracy: 0, bestScore: 0, total: 0, chartData: [] };
                let totalAccuracy = 0;
                let bestScore = 0;
                
                // Ordenar por data cronológica
                const sorted = [...simulados].sort((a,b) => new Date(a.date) - new Date(b.date));
                
                const chartData = sorted.map((sim, i) => {
                    const acc = sim.total > 0 ? Math.round((sim.correct / sim.total) * 100) : 0;
                    totalAccuracy += acc;
                    if (sim.correct > bestScore) bestScore = sim.correct;
                    
                    // Formatar data (DD/MM)
                    const d = new Date(sim.date + 'T12:00:00'); 
                    const dateStr = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}`;
                    
                    return { 
                        name: `Simulado ${i+1}`, 
                        Data: dateStr, 
                        Acertos: sim.correct, 
                        Aproveitamento: acc,
                        Total: sim.total
                    };
                });
                return { 
                    avgAccuracy: Math.round(totalAccuracy / simulados.length), 
                    bestScore, 
                    total: simulados.length, 
                    chartData 
                };
            }, [simulados]);

            const COLORS = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#64748b'];

            return (
                <div 
                    className="flex flex-col h-screen overflow-hidden transition-colors duration-200 relative"
                    style={{ 
                        backgroundImage: "url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg/1920px-Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg')", 
                        backgroundSize: 'cover', 
                        backgroundPosition: 'center',
                        backgroundAttachment: 'fixed'
                    }}
                >
                    {/* Overlay para garantir a legibilidade do texto (Efeito Vidro) */}
                    <div className="absolute inset-0 bg-gray-100/80 dark:bg-[#111827]/90 z-0 pointer-events-none transition-colors duration-200"></div>

                    <div className="relative z-10 flex flex-col h-full w-full">
                        {/* BARRA SUPERIOR GLOBAL */}
                        <header className="flex justify-between items-center p-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-b border-gray-200/50 dark:border-darkBorder/50 shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-sm md:text-base shadow-lg">TJ</div>
                                <h1 className="text-lg md:text-xl font-bold text-gray-800 dark:text-white hidden sm:block">Alvo no TJSP</h1>
                            </div>
                            
                            <div className="flex items-center gap-4 md:gap-6">
                                {/* Pomodoro */}
                                <div className="flex items-center gap-2 bg-gray-100/80 dark:bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-200/50 dark:border-gray-700/50">
                                    <span className={`text-xs font-bold uppercase ${pomodoroMode === 'study' ? 'text-indigo-600 dark:text-indigo-400' : 'text-green-600 dark:text-green-400'} hidden md:block`}>
                                        {pomodoroMode === 'study' ? 'Foco' : 'Pausa'}
                                    </span>
                                    <span className="font-mono text-sm font-bold w-12 text-center text-gray-800 dark:text-gray-100">{formatTime(timeLeft)}</span>
                                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="text-gray-600 hover:text-indigo-600 dark:text-gray-300 dark:hover:text-indigo-400 transition-colors">
                                        {isTimerRunning ? <Icons.Pause /> : <Icons.Play />}
                                    </button>
                                    <button onClick={resetTimer} className="text-gray-600 hover:text-red-500 dark:text-gray-300 dark:hover:text-red-400 transition-colors">
                                        <Icons.Refresh />
                                    </button>
                                </div>

                                {/* Streak */}
                                <div className="flex items-center gap-1 text-orange-500 font-bold" title="Dias seguidos de estudo">
                                    <Icons.Flame />
                                    <span>{streak.count}</span>
                                </div>

                                {/* Dark Mode Toggle */}
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full bg-gray-100/80 hover:bg-gray-200/80 dark:bg-gray-800/80 dark:hover:bg-gray-700/80 text-gray-600 dark:text-gray-300 transition-colors">
                                    {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </header>

                        <div className="flex flex-1 overflow-hidden">
                            {/* SIDEBAR DESKTOP */}
                            <aside className="w-64 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-r border-gray-200/50 dark:border-darkBorder/50 hidden md:flex flex-col">
                                <nav className="flex-1 p-4 space-y-2">
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <Icons.LayoutDashboard /> Visão Geral
                                    </button>
                                    <button onClick={() => setActiveTab('cronograma')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeTab === 'cronograma' ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <Icons.Calendar /> Cronograma (120 Dias)
                                    </button>
                                    <button onClick={() => setActiveTab('revisoes')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-colors ${activeTab === 'revisoes' ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <div className="flex items-center gap-3">
                                            <Icons.BookOpen /> Caderno de Erros
                                        </div>
                                        {stats.daysWithPendingReviews > 0 && (
                                            <span className="bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 text-xs font-bold px-2 py-1 rounded-full">
                                                {stats.daysWithPendingReviews}
                                            </span>
                                        )}
                                    </button>
                                    <button onClick={() => setActiveTab('simulados')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeTab === 'simulados' ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <Icons.ClipboardList /> Simulados
                                    </button>
                                    <button onClick={() => setActiveTab('redacoes')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeTab === 'redacoes' ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <Icons.Pen /> Redações
                                    </button>
                                </nav>
                                <div className="p-6 border-t border-gray-200 dark:border-darkBorder">
                                    <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-4 text-white">
                                        <p className="text-sm font-medium mb-1">Reta Final TJSP</p>
                                        <div className="w-full bg-white/30 rounded-full h-2 mb-2">
                                            <div className="bg-white rounded-full h-2" style={{ width: `${stats.progressPercentage}%` }}></div>
                                        </div>
                                        <p className="text-xs text-indigo-100">{stats.progressPercentage}% Concluído</p>
                                    </div>
                                </div>
                            </aside>

                            {/* NAVBAR MOBILE */}
                            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-t border-gray-200/50 dark:border-darkBorder/50 flex justify-around p-3 z-40 pb-safe">
                                <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab === 'dashboard' ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}`}>
                                    <Icons.LayoutDashboard />
                                    <span className="text-[10px] mt-1">Geral</span>
                                </button>
                                <button onClick={() => setActiveTab('cronograma')} className={`flex flex-col items-center ${activeTab === 'cronograma' ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}`}>
                                    <Icons.Calendar />
                                    <span className="text-[10px] mt-1">Dias</span>
                                </button>
                                <button onClick={() => setActiveTab('revisoes')} className={`flex flex-col items-center relative ${activeTab === 'revisoes' ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}`}>
                                    <Icons.BookOpen />
                                    <span className="text-[10px] mt-1">Revisão</span>
                                    {stats.daysWithPendingReviews > 0 && (
                                        <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">
                                            {stats.daysWithPendingReviews}
                                        </span>
                                    )}
                                </button>
                                <button onClick={() => setActiveTab('simulados')} className={`flex flex-col items-center ${activeTab === 'simulados' ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}`}>
                                    <Icons.ClipboardList />
                                    <span className="text-[10px] mt-1">Simulados</span>
                                </button>
                                <button onClick={() => setActiveTab('redacoes')} className={`flex flex-col items-center ${activeTab === 'redacoes' ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}`}>
                                    <Icons.Pen />
                                    <span className="text-[10px] mt-1">Redações</span>
                                </button>
                            </div>

                            {/* ÁREA PRINCIPAL */}
                            <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 pb-24 md:pb-8">
                                
                                {/* TAB: DASHBOARD */}
                                {activeTab === 'dashboard' && (
                                    <div className="max-w-6xl mx-auto space-y-6">
                                        <header className="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
                                            <div>
                                                <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">O seu Progresso! 🎯</h2>
                                                <p className="text-gray-500 dark:text-gray-400 mt-2">Acompanhe a sua evolução e faça cópias de segurança (backup).</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={exportData} className="flex items-center gap-2 bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                                                    <Icons.Download /> Exportar
                                                </button>
                                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                                                    <Icons.Upload /> Importar
                                                </button>
                                                <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                                            </div>
                                        </header>

                                        {/* GRID DE CARDS */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4 transition-colors">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400 font-medium">Dias Completos</p>
                                                    <p className="text-xl font-bold text-gray-800 dark:text-white">{stats.fullyCompletedDays} <span className="text-xs font-normal text-gray-400">/ 120</span></p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4 transition-colors">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
                                                    <Icons.Target />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400 font-medium">Tópicos Estudados</p>
                                                    <p className="text-xl font-bold text-gray-800 dark:text-white">{stats.completedSubjects} <span className="text-xs font-normal text-gray-400">/ {stats.totalSubjects}</span></p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4 transition-colors">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-600 dark:text-red-400">
                                                    <Icons.AlertCircle />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400 font-medium">Revisões Pendentes</p>
                                                    <p className="text-xl font-bold text-gray-800 dark:text-white">{stats.daysWithPendingReviews}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4 transition-colors relative overflow-hidden">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600 dark:text-green-400">
                                                    <Icons.Activity />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400 font-medium">Aproveitamento Geral</p>
                                                    <div className="flex items-baseline gap-1">
                                                        <p className="text-xl font-bold text-gray-800 dark:text-white">{questionStats.globalAccuracy}%</p>
                                                        <p className="text-[10px] text-gray-400">({questionStats.totalCorrect} de {questionStats.totalQuestions} q.)</p>
                                                    </div>
                                                </div>
                                                {/* Indicador de Saúde */}
                                                <div className={`absolute bottom-0 left-0 h-1 w-full ${questionStats.globalAccuracy >= 85 ? 'bg-green-500' : questionStats.globalAccuracy >= 70 ? 'bg-yellow-400' : 'bg-red-500'}`}></div>
                                            </div>
                                        </div>

                                        {/* Gráficos Principais */}
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder">
                                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-6">Metas por Matéria (%)</h3>
                                                <div className="h-72">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <BarChart data={chartData} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                            <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke={isDarkMode ? '#374151' : '#e5e7eb'} />
                                                            <XAxis type="number" domain={[0, 100]} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                            <YAxis dataKey="name" type="category" width={100} tick={{fontSize: 12, fill: isDarkMode ? '#d1d5db' : '#374151'}} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                            <Tooltip cursor={{fill: isDarkMode ? '#374151' : '#f3f4f6'}} contentStyle={{backgroundColor: isDarkMode ? '#1f2937' : '#fff', borderColor: isDarkMode ? '#4b5563' : '#e5e7eb', color: isDarkMode ? '#f3f4f6' : '#1f2937'}} formatter={(value) => `${value}%`} />
                                                            <Bar dataKey="percentage" name="Concluído" radius={[0, 4, 4, 0]}>
                                                                {chartData.map((entry, index) => (
                                                                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                                ))}
                                                            </Bar>
                                                        </BarChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>

                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex flex-col">
                                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-2">Desempenho em Questões (Acertos vs Erros)</h3>
                                                <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">Adicione as suas questões resolvidas nos detalhes de cada dia do cronograma.</p>
                                                {questionStats.hasData ? (
                                                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-8 max-h-[450px]">
                                                        {questionStats.groupedData.map((group, idx) => (
                                                            <div key={idx} className="flex flex-col">
                                                                <h4 className="text-sm font-bold text-indigo-600 dark:text-indigo-400 mb-3 uppercase tracking-wider border-b border-gray-100 dark:border-gray-800 pb-2">{group.subject}</h4>
                                                                <div className="h-56">
                                                                    <ResponsiveContainer width="100%" height="100%">
                                                                        <BarChart data={group.topics} margin={{ top: 10, right: 30, left: 0, bottom: 5 }}>
                                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#374151' : '#e5e7eb'} />
                                                                            <XAxis dataKey="displayName" tick={{fontSize: 10, fill: isDarkMode ? '#d1d5db' : '#374151'}} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                                            <YAxis tick={{fontSize: 12, fill: isDarkMode ? '#d1d5db' : '#374151'}} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                                            <Tooltip 
                                                                                cursor={{fill: isDarkMode ? '#374151' : '#f3f4f6'}} 
                                                                                contentStyle={{backgroundColor: isDarkMode ? '#1f2937' : '#fff', borderColor: isDarkMode ? '#4b5563' : '#e5e7eb', color: isDarkMode ? '#f3f4f6' : '#1f2937'}} 
                                                                                labelFormatter={(label, payload) => payload && payload.length > 0 ? payload[0].payload.name : label}
                                                                            />
                                                                            {idx === 0 && <Legend wrapperStyle={{fontSize: '12px', paddingTop: '10px'}} />}
                                                                            <Bar dataKey="Acertos" stackId="a" fill="#10b981" />
                                                                            <Bar dataKey="Erros" stackId="a" fill="#ef4444" radius={[4, 4, 0, 0]} />
                                                                        </BarChart>
                                                                    </ResponsiveContainer>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="flex-1 flex flex-col items-center justify-center text-center opacity-50 min-h-[250px]">
                                                        <Icons.Activity />
                                                        <p className="mt-2 text-sm text-gray-500 dark:text-gray-400">Sem dados de questões registados.<br/>Resolva questões e anote no cronograma!</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TAB: CRONOGRAMA */}
                                {activeTab === 'cronograma' && (
                                    <div className="max-w-6xl mx-auto">
                                        <header className="mb-6">
                                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Cronograma de 120 Dias</h2>
                                            <p className="text-gray-500 dark:text-gray-400 mt-2">O seu progresso é salvo automaticamente. Clique num dia para estudar.</p>
                                        </header>

                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                            {days.map(day => {
                                                const total = day.subjects.length;
                                                const done = day.subjects.filter(s => s.done).length;
                                                let statusClass = "bg-white dark:bg-darkCard border-gray-200 dark:border-gray-700 hover:border-indigo-300 dark:hover:border-indigo-500 text-gray-700 dark:text-gray-300";
                                                
                                                if (total > 0 && done === total) {
                                                    statusClass = "bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-700 dark:text-green-400";
                                                } else if (done > 0) {
                                                    statusClass = "bg-yellow-50 dark:bg-yellow-900/20 border-yellow-200 dark:border-yellow-800 text-yellow-700 dark:text-yellow-400";
                                                }

                                                const hasPendingNotes = day.pendingNotes.trim() !== '' && !day.reviewScheduled;

                                                return (
                                                    <div 
                                                        key={day.id} 
                                                        onClick={() => setSelectedDayId(day.id)}
                                                        className={`relative cursor-pointer border rounded-xl p-4 transition-all hover:shadow-md flex flex-col items-center justify-center text-center h-28 ${statusClass}`}
                                                    >
                                                        {hasPendingNotes && (
                                                            <span className="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                                                        )}
                                                        <span className="text-xs font-bold uppercase tracking-wider mb-1 opacity-70">Dia</span>
                                                        <span className="text-3xl font-black">{day.id}</span>
                                                        <div className="mt-2 w-full bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 overflow-hidden">
                                                            <div className="bg-current h-full opacity-80 transition-all duration-300" style={{ width: `${total > 0 ? (done/total)*100 : 0}%` }}></div>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* TAB: REVISÕES / CADERNO DE ERROS */}
                                {activeTab === 'revisoes' && (
                                    <div className="max-w-4xl mx-auto space-y-6">
                                        <header className="mb-6">
                                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Caderno de Erros 🧠</h2>
                                            <p className="text-gray-500 dark:text-gray-400 mt-2">As suas anotações e dúvidas dos dias anteriores para revisão.</p>
                                        </header>

                                        {/* Campo de Pesquisa */}
                                        <div className="relative mb-6">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                                <Icons.Search />
                                            </div>
                                            <input 
                                                type="text" 
                                                placeholder="Procurar por disciplina, tema ou palavra-chave..." 
                                                className="w-full pl-10 pr-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-darkCard text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 outline-none transition-colors"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                            />
                                        </div>

                                        {(() => {
                                            let diasComAnotacoes = days.filter(d => d.pendingNotes.trim() !== '');
                                            
                                            if (searchQuery.trim() !== '') {
                                                const query = searchQuery.toLowerCase();
                                                diasComAnotacoes = diasComAnotacoes.filter(d => 
                                                    d.pendingNotes.toLowerCase().includes(query) ||
                                                    d.subjects.some(s => s.name.toLowerCase().includes(query))
                                                );
                                            }

                                            if (diasComAnotacoes.length === 0) {
                                                return (
                                                    <div className="text-center py-20 bg-white dark:bg-darkCard rounded-2xl border border-dashed border-gray-300 dark:border-gray-700 transition-colors">
                                                        <div className="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                                                            <Icons.CheckCircle />
                                                        </div>
                                                        <h3 className="text-xl font-bold text-gray-800 dark:text-white">Nenhum resultado</h3>
                                                        <p className="text-gray-500 dark:text-gray-400 mt-2">
                                                            {searchQuery ? "Nenhuma anotação corresponde à sua pesquisa." : "Tudo limpo! Não tem pendências anotadas no seu cronograma."}
                                                        </p>
                                                    </div>
                                                );
                                            }

                                            return (
                                                <div className="space-y-4">
                                                    {diasComAnotacoes.map(day => (
                                                        <div key={day.id} className={`bg-white dark:bg-darkCard rounded-xl shadow-sm border p-6 transition-colors ${day.reviewScheduled ? 'border-green-200 dark:border-green-800 bg-green-50/30 dark:bg-green-900/10' : 'border-l-4 border-l-red-500 border-gray-200 dark:border-y-gray-800 dark:border-r-gray-800'}`}>
                                                            <div className="flex flex-col sm:flex-row justify-between items-start gap-4 mb-4">
                                                                <div>
                                                                    <h3 className="text-lg font-bold text-gray-800 dark:text-white">Revisão do Dia {day.id}</h3>
                                                                    <p className="text-sm text-gray-500 dark:text-gray-400">Matérias: {day.subjects.map(s => s.name).join(', ')}</p>
                                                                </div>
                                                                <button 
                                                                    onClick={() => toggleReviewStatus(day.id)}
                                                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors w-full sm:w-auto ${day.reviewScheduled ? 'bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-400 hover:bg-green-200 dark:hover:bg-green-900/60' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40 border border-red-200 dark:border-red-800'}`}
                                                                >
                                                                    {day.reviewScheduled ? 'Revisão Concluída ✓' : 'Marcar como Revisado'}
                                                                </button>
                                                            </div>
                                                            <div className="bg-gray-50 dark:bg-gray-800 rounded-lg p-4 border border-gray-100 dark:border-gray-700 text-gray-700 dark:text-gray-300 whitespace-pre-wrap font-medium">
                                                                {day.pendingNotes}
                                                            </div>
                                                            <div className="mt-4 flex justify-end">
                                                                <button onClick={() => { setActiveTab('cronograma'); setSelectedDayId(day.id); }} className="text-sm text-indigo-600 dark:text-indigo-400 font-medium hover:underline">
                                                                    Ir para o Dia {day.id} →
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                {/* TAB: SIMULADOS */}
                                {activeTab === 'simulados' && (
                                    <div className="max-w-6xl mx-auto space-y-6">
                                        <header className="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                                            <div>
                                                <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Simulados 📝</h2>
                                                <p className="text-gray-500 dark:text-gray-400 mt-2">Acompanhe a evolução da sua nota nos testes gerais.</p>
                                            </div>
                                            <button onClick={() => setIsSimuladoModalOpen(true)} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition-colors shadow-sm">
                                                <Icons.Plus /> Novo Simulado
                                            </button>
                                        </header>

                                        {/* CARDS DE RESUMO */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
                                                    <Icons.ClipboardList />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Simulados Feitos</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{simuladoStats.total}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600 dark:text-green-400">
                                                    <Icons.Activity />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Média de Aproveitamento</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{simuladoStats.avgAccuracy}%</p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center text-yellow-600 dark:text-yellow-400">
                                                    <Icons.Target />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Maior Pontuação</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{simuladoStats.bestScore} <span className="text-sm font-normal text-gray-400">acertos</span></p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* GRÁFICO DE EVOLUÇÃO E HISTÓRICO */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8">
                                            <div className="lg:col-span-2 bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder">
                                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-6">Evolução do Desempenho (%)</h3>
                                                {simulados.length >= 2 ? (
                                                    <div className="h-72">
                                                        <ResponsiveContainer width="100%" height="100%">
                                                            <LineChart data={simuladoStats.chartData} margin={{ top: 5, right: 30, left: 0, bottom: 5 }}>
                                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDarkMode ? '#374151' : '#e5e7eb'} />
                                                                <XAxis dataKey="Data" tick={{fontSize: 12, fill: isDarkMode ? '#d1d5db' : '#374151'}} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                                <YAxis domain={[0, 100]} tick={{fontSize: 12, fill: isDarkMode ? '#d1d5db' : '#374151'}} stroke={isDarkMode ? '#9ca3af' : '#6b7280'} />
                                                                <Tooltip 
                                                                    cursor={{stroke: isDarkMode ? '#4b5563' : '#d1d5db', strokeWidth: 2}} 
                                                                    contentStyle={{backgroundColor: isDarkMode ? '#1f2937' : '#fff', borderColor: isDarkMode ? '#4b5563' : '#e5e7eb', color: isDarkMode ? '#f3f4f6' : '#1f2937'}} 
                                                                    formatter={(value, name) => [name === 'Aproveitamento' ? `${value}%` : value, name]}
                                                                />
                                                                <Legend wrapperStyle={{fontSize: '12px', paddingTop: '10px'}} />
                                                                <Line type="monotone" dataKey="Aproveitamento" stroke="#4f46e5" strokeWidth={3} activeDot={{ r: 8 }} />
                                                            </LineChart>
                                                        </ResponsiveContainer>
                                                    </div>
                                                ) : (
                                                    <div className="h-72 flex flex-col items-center justify-center text-center opacity-50 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl">
                                                        <Icons.Activity />
                                                        <p className="mt-2 text-sm text-gray-500 dark:text-gray-400">Adicione pelo menos 2 simulados<br/>para visualizar a sua evolução.</p>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex flex-col">
                                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-4">Histórico</h3>
                                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3 max-h-[300px] lg:max-h-[320px]">
                                                    {simulados.length > 0 ? (
                                                        [...simulados].sort((a,b) => new Date(b.date) - new Date(a.date)).map((sim) => {
                                                            const acc = sim.total > 0 ? Math.round((sim.correct / sim.total) * 100) : 0;
                                                            const d = new Date(sim.date + 'T12:00:00');
                                                            const dateStr = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                                                            
                                                            return (
                                                                <div key={sim.id} className="p-4 border border-gray-100 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800/50 flex flex-col gap-2 relative">
                                                                    <button onClick={() => handleDeleteSimulado(sim.id)} className="absolute top-3 right-3 text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors" title="Excluir">
                                                                        <Icons.Trash />
                                                                    </button>
                                                                    <div className="pr-6">
                                                                        <p className="text-sm font-bold text-gray-800 dark:text-white">{dateStr}</p>
                                                                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">{sim.correct} acertos de {sim.total} questões</p>
                                                                    </div>
                                                                    <div className="flex items-center gap-3 mt-1">
