                                                                        <span className={`text-xs font-bold px-2 py-1 rounded ${acc >= 85 ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : acc >= 70 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}`}>
                                                                            {acc}% de aproveitamento
                                                                        </span>
                                                                        {sim.time && <span className="text-xs text-gray-500 dark:text-gray-400">⏱️ {sim.time}</span>}
                                                                    </div>
                                                                    {sim.notes && <p className="text-xs text-gray-600 dark:text-gray-300 italic mt-2 border-t border-gray-200 dark:border-gray-700 pt-2 break-words">"{sim.notes}"</p>}
                                                                </div>
                                                            );
                                                        })
                                                    ) : (
                                                        <p className="text-sm text-gray-500 dark:text-gray-400 text-center mt-10">Nenhum simulado registado.</p>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TAB: REDAÇÕES */}
                                {activeTab === 'redacoes' && (
                                    <div className="max-w-6xl mx-auto space-y-6">
                                        <header className="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                                            <div>
                                                <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Redações ✍️</h2>
                                                <p className="text-gray-500 dark:text-gray-400 mt-2">Controle os temas que vai utilizar e o tempo gasto em cada texto.</p>
                                            </div>
                                            <button onClick={() => setIsRedacaoModalOpen(true)} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition-colors shadow-sm">
                                                <Icons.Plus /> Novo Tema
                                            </button>
                                        </header>

                                        {/* CARDS DE RESUMO REDAÇÃO */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
                                                    <Icons.Pen />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Total de Temas</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{redacoes.length}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600 dark:text-green-400">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Redações Concluídas</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{redacoes.filter(r => r.status === 'concluida').length}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder flex items-center gap-4">
                                                <div className="w-12 h-12 shrink-0 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center text-yellow-600 dark:text-yellow-400">
                                                    <Icons.Activity />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Temas Planejados</p>
                                                    <p className="text-2xl font-bold text-gray-800 dark:text-white">{redacoes.filter(r => r.status === 'planejada').length}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* LISTA DE REDAÇÕES */}
                                        <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-darkBorder overflow-hidden">
                                            <div className="p-6 border-b border-gray-100 dark:border-gray-700">
                                                <h3 className="text-lg font-bold text-gray-800 dark:text-white">Meus Temas e Rascunhos</h3>
                                            </div>
                                            <div className="p-6">
                                                {redacoes.length > 0 ? (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                        {[...redacoes].sort((a,b) => new Date(b.date) - new Date(a.date)).map((redacao) => {
                                                            const isConcluida = redacao.status === 'concluida';
                                                            const d = new Date(redacao.date + 'T12:00:00');
                                                            const dateStr = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                                                            
                                                            return (
                                                                <div key={redacao.id} className={`p-5 border rounded-xl flex flex-col relative transition-all ${isConcluida ? 'bg-green-50/50 dark:bg-green-900/10 border-green-200 dark:border-green-800/50' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:border-indigo-300 dark:hover:border-indigo-500'}`}>
                                                                    <button onClick={() => handleDeleteRedacao(redacao.id)} className="absolute top-4 right-4 text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors" title="Excluir">
                                                                        <Icons.Trash />
                                                                    </button>
                                                                    
                                                                    <div className="pr-8 mb-4">
                                                                        <span className={`inline-block px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider mb-2 ${isConcluida ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400'}`}>
                                                                            {redacao.status}
                                                                        </span>
                                                                        <h4 className="font-bold text-gray-800 dark:text-white leading-snug">{redacao.theme}</h4>
                                                                    </div>

                                                                    <div className="flex items-center justify-between text-sm text-gray-500 dark:text-gray-400 mb-4 bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                                                                        <div className="flex flex-col">
                                                                            <span className="text-[10px] uppercase font-bold text-gray-400">Tempo Gasto</span>
                                                                            <span className="font-medium text-gray-700 dark:text-gray-300">⏱️ {redacao.time || '--'}</span>
                                                                        </div>
                                                                        <div className="flex flex-col text-right">
                                                                            <span className="text-[10px] uppercase font-bold text-gray-400">Data</span>
                                                                            <span className="font-medium text-gray-700 dark:text-gray-300">📅 {dateStr}</span>
                                                                        </div>
                                                                    </div>

                                                                    {redacao.notes && (
                                                                        <div className="mb-4 flex-1">
                                                                            <p className="text-xs text-gray-600 dark:text-gray-400 italic bg-gray-50 dark:bg-gray-800 p-3 rounded-lg border border-gray-100 dark:border-gray-700 break-words line-clamp-3" title={redacao.notes}>"{redacao.notes}"</p>
                                                                        </div>
                                                                    )}

                                                                    <div className="mt-auto pt-4 border-t border-gray-100 dark:border-gray-700">
                                                                        <button 
                                                                            onClick={() => toggleRedacaoStatus(redacao.id)}
                                                                            className={`w-full py-2 rounded-lg text-sm font-bold transition-colors ${isConcluida ? 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                                                                        >
                                                                            {isConcluida ? 'Marcar como Planejada' : 'Marcar como Concluída ✓'}
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <div className="py-12 flex flex-col items-center justify-center text-center opacity-50 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl">
                                                        <Icons.Pen />
                                                        <p className="mt-2 text-sm text-gray-500 dark:text-gray-400">Nenhuma redação registada.<br/>Adicione temas que planeja escrever!</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>
                        </div>

                        {/* MODAL: DETALHES DO DIA */}
                        {selectedDayId !== null && (
                            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50">
                                <div className="bg-white dark:bg-darkCard rounded-2xl shadow-xl w-full max-w-2xl max-h-[95vh] flex flex-col overflow-hidden animate-fade-in border border-gray-100 dark:border-darkBorder">
                                    {(() => {
                                        const day = days.find(d => d.id === selectedDayId);
                                        const total = day.subjects.length;
                                        const done = day.subjects.filter(s => s.done).length;
                                        
                                        return (
                                            <>
                                                <div className="p-4 sm:p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-indigo-50/50 dark:bg-indigo-900/10">
                                                    <div>
                                                        <h2 className="text-xl sm:text-2xl font-black text-gray-800 dark:text-white">Dia {day.id}</h2>
                                                        <p className="text-sm text-indigo-600 dark:text-indigo-400 font-medium mt-1">{done} de {total} tarefas concluídas</p>
                                                    </div>
                                                    <button onClick={() => {setSelectedDayId(null); setEditingMeta(null);}} className="w-10 h-10 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                                        ✕
                                                    </button>
                                                </div>
                                                
                                                <div className="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-8">
                                                    {/* Lista de Matérias */}
                                                    <section>
                                                        <div className="flex justify-between items-center mb-4">
                                                            <h3 className="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Metas do Dia e Questões</h3>
                                                        </div>
                                                        <div className="space-y-4">
                                                            {day.subjects.map((subject, idx) => {
                                                                const isEditing = editingMeta && editingMeta.dayId === day.id && editingMeta.subjectIndex === idx;
                                                                const qCorrect = subject.questions?.correct || 0;
                                                                const qWrong = subject.questions?.wrong || 0;
                                                                const qTotal = qCorrect + qWrong;
                                                                const qAccuracy = qTotal > 0 ? Math.round((qCorrect / qTotal) * 100) : null;
                                                                
                                                                return (
                                                                    <div key={idx} className={`p-3 sm:p-4 rounded-xl border transition-all flex flex-col gap-3 ${subject.done && !isEditing ? 'bg-green-50/50 dark:bg-green-900/5 border-green-200 dark:border-green-800/50' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'}`}>
                                                                        
                                                                        {isEditing ? (
                                                                            <div className="flex-1 space-y-2 w-full">
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editingMeta.tempName} 
                                                                                    onChange={(e) => setEditingMeta({...editingMeta, tempName: e.target.value})}
                                                                                    className="w-full text-sm font-bold p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500"
                                                                                    placeholder="Disciplina"
                                                                                />
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editingMeta.tempTopic} 
                                                                                    onChange={(e) => setEditingMeta({...editingMeta, tempTopic: e.target.value})}
                                                                                    className="w-full text-sm p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 outline-none focus:ring-2 focus:ring-indigo-500"
                                                                                    placeholder="Tópico a estudar"
                                                                                />
                                                                                <div className="flex gap-2 justify-end mt-2">
                                                                                    <button onClick={() => setEditingMeta(null)} className="text-xs font-medium px-3 py-1.5 rounded text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-600">Cancelar</button>
                                                                                    <button onClick={saveMetaEdit} className="text-xs font-bold px-3 py-1.5 rounded bg-indigo-600 text-white hover:bg-indigo-700">Guardar</button>
                                                                                </div>
                                                                            </div>
                                                                        ) : (
                                                                            <>
                                                                                <div className="flex flex-row items-center gap-3">
                                                                                    <div className="flex items-center gap-3 flex-1 cursor-pointer" onClick={() => toggleSubjectDone(day.id, idx)}>
                                                                                        <div className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors ${subject.done ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 dark:border-gray-500'}`}>
                                                                                            {subject.done && <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                                                                                        </div>
                                                                                        <div>
                                                                                            <p className={`font-bold ${subject.done ? 'text-green-800 dark:text-green-500 line-through opacity-70' : 'text-gray-800 dark:text-gray-100'}`}>{subject.name}</p>
                                                                                            <p className={`text-sm ${subject.done ? 'text-green-600 dark:text-green-600/70 line-through opacity-70' : 'text-gray-500 dark:text-gray-400'}`}>{subject.topic}</p>
                                                                                        </div>
                                                                                    </div>
                                                                                    <button 
                                                                                        onClick={() => setEditingMeta({ dayId: day.id, subjectIndex: idx, tempName: subject.name, tempTopic: subject.topic })}
                                                                                        className="p-2 text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
                                                                                        title="Editar Meta"
                                                                                    >
                                                                                        <Icons.Edit />
                                                                                    </button>
                                                                                </div>

                                                                                {/* ÁREA DE QUESTÕES (Rastreador) */}
                                                                                <div className="pl-9 pt-2 flex flex-col gap-2">
                                                                                    <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 line-clamp-1" title={`Questões sobre: ${subject.topic}`}>
                                                                                        🎯 Questões: {subject.topic}
                                                                                    </span>
                                                                                    <div className="flex flex-wrap items-center gap-4">
                                                                                        <div className="flex items-center gap-2">
                                                                                            <div className="flex items-center bg-gray-100 dark:bg-gray-700/50 rounded-lg p-1 border border-gray-200 dark:border-gray-700">
                                                                                                <span className="text-xs text-green-600 dark:text-green-400 font-bold px-1.5">✓</span>
                                                                                                <input 
                                                                                                    type="number" 
                                                                                                    min="0"
                                                                                                    placeholder="Acertos"
                                                                                                    className="w-12 h-6 text-center text-xs font-semibold bg-transparent border-none focus:ring-0 text-gray-800 dark:text-gray-100 placeholder-gray-400 outline-none"
                                                                                                    value={qCorrect || ''}
                                                                                                    onChange={(e) => updateQuestions(day.id, idx, 'correct', e.target.value)}
                                                                                                />
                                                                                            </div>
                                                                                            <div className="flex items-center bg-gray-100 dark:bg-gray-700/50 rounded-lg p-1 border border-gray-200 dark:border-gray-700">
                                                                                                <span className="text-xs text-red-600 dark:text-red-400 font-bold px-1.5">✗</span>
                                                                                                <input 
                                                                                                    type="number" 
                                                                                                    min="0"
                                                                                                    placeholder="Erros"
                                                                                                    className="w-12 h-6 text-center text-xs font-semibold bg-transparent border-none focus:ring-0 text-gray-800 dark:text-gray-100 placeholder-gray-400 outline-none"
                                                                                                    value={qWrong || ''}
                                                                                                    onChange={(e) => updateQuestions(day.id, idx, 'wrong', e.target.value)}
                                                                                                />
                                                                                            </div>
                                                                                        </div>
                                                                                        
                                                                                        {/* Badge de Aproventamento */}
                                                                                        {qTotal > 0 && (
                                                                                            <div className={`px-2 py-1 rounded text-xs font-bold ${qAccuracy >= 85 ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : qAccuracy >= 70 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}`}>
                                                                                                {qAccuracy}% aproveitamento
                                                                                            </div>
                                                                                        )}
                                                                                    </div>
                                                                                </div>
                                                                            </>
                                                                        )}
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    </section>

                                                    {/* Área de Anotações / Erros */}
                                                    <section>
                                                        <h3 className="text-sm font-bold text-red-400 dark:text-red-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                                                            <Icons.AlertCircle /> O que não entendi / Caderno de Erros
                                                        </h3>
                                                        <div className="bg-red-50/50 dark:bg-red-900/10 rounded-xl p-4 border border-red-100 dark:border-red-900/30">
                                                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-3">Anotar aqui criará um card automático na aba "Caderno de Erros" para agendar a sua revisão.</p>
                                                            <textarea 
                                                                className="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-3 text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"
                                                                rows="4"
                                                                placeholder="Ex: Errei muito nas questões de Crase. Preciso rever a diferença entre impedimento e suspeição do juiz..."
                                                                value={day.pendingNotes}
                                                                onChange={(e) => updatePendingNotes(day.id, e.target.value)}
                                                            ></textarea>
                                                        </div>
                                                    </section>
                                                </div>

                                                <div className="p-4 sm:p-6 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end">
                                                    <button onClick={() => {setSelectedDayId(null); setEditingMeta(null);}} className="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">
                                                        Fechar
                                                    </button>
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {/* MODAL: ADICIONAR SIMULADO */}
                        {isSimuladoModalOpen && (
                            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50">
                                <div className="bg-white dark:bg-darkCard rounded-2xl shadow-xl w-full max-w-md flex flex-col overflow-hidden animate-fade-in border border-gray-100 dark:border-darkBorder">
                                    <div className="p-4 sm:p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-indigo-50/50 dark:bg-indigo-900/10">
                                        <h2 className="text-xl font-black text-gray-800 dark:text-white">Registar Simulado</h2>
                                        <button onClick={() => setIsSimuladoModalOpen(false)} className="w-8 h-8 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                            ✕
                                        </button>
                                    </div>
                                    <div className="p-4 sm:p-6 space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Data</label>
                                            <input type="date" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newSimulado.date} onChange={(e) => setNewSimulado({...newSimulado, date: e.target.value})} />
                                        </div>
                                        <div className="grid grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Total Q.</label>
                                                <input type="number" min="1" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-center" value={newSimulado.total} onChange={(e) => setNewSimulado({...newSimulado, total: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-green-600 dark:text-green-400 mb-1">Acertos</label>
                                                <input type="number" min="0" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-center" value={newSimulado.correct} onChange={(e) => setNewSimulado({...newSimulado, correct: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-red-600 dark:text-red-400 mb-1">Erros/Brancos</label>
                                                <input type="number" min="0" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-center" value={newSimulado.wrong} onChange={(e) => setNewSimulado({...newSimulado, wrong: e.target.value})} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Tempo Gasto <span className="text-gray-400 font-normal">(Opcional)</span></label>
                                            <input type="text" placeholder="Ex: 3h 45min" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newSimulado.time} onChange={(e) => setNewSimulado({...newSimulado, time: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Anotações / Foco de Melhora</label>
                                            <textarea rows="3" placeholder="Ex: Fui muito mal em Informática, preciso rever fórmulas do Excel..." className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none resize-none" value={newSimulado.notes} onChange={(e) => setNewSimulado({...newSimulado, notes: e.target.value})}></textarea>
                                        </div>
                                    </div>
                                    <div className="p-4 sm:p-6 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                                        <button onClick={() => setIsSimuladoModalOpen(false)} className="px-5 py-2.5 rounded-xl font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancelar</button>
                                        <button onClick={handleAddSimulado} className="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">Guardar Simulado</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL: ADICIONAR REDAÇÃO */}
                        {isRedacaoModalOpen && (
                            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50">
                                <div className="bg-white dark:bg-darkCard rounded-2xl shadow-xl w-full max-w-md flex flex-col overflow-hidden animate-fade-in border border-gray-100 dark:border-darkBorder">
                                    <div className="p-4 sm:p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-indigo-50/50 dark:bg-indigo-900/10">
                                        <h2 className="text-xl font-black text-gray-800 dark:text-white">Adicionar Tema/Redação</h2>
                                        <button onClick={() => setIsRedacaoModalOpen(false)} className="w-8 h-8 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                            ✕
                                        </button>
                                    </div>
                                    <div className="p-4 sm:p-6 space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Tema da Redação</label>
                                            <input type="text" placeholder="Ex: O envelhecimento da população..." className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newRedacao.theme} onChange={(e) => setNewRedacao({...newRedacao, theme: e.target.value})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Data</label>
                                                <input type="date" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newRedacao.date} onChange={(e) => setNewRedacao({...newRedacao, date: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Status</label>
                                                <select className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newRedacao.status} onChange={(e) => setNewRedacao({...newRedacao, status: e.target.value})}>
                                                    <option value="planejada">Planejada</option>
                                                    <option value="concluida">Concluída</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Tempo Gasto <span className="text-gray-400 font-normal">(Opcional)</span></label>
                                            <input type="text" placeholder="Ex: 1h 10min" className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" value={newRedacao.time} onChange={(e) => setNewRedacao({...newRedacao, time: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Argumentos / Ideias / Feedback</label>
                                            <textarea rows="3" placeholder="Escreva aqui palavras-chave, citações ou o feedback da correção..." className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none resize-none" value={newRedacao.notes} onChange={(e) => setNewRedacao({...newRedacao, notes: e.target.value})}></textarea>
                                        </div>
                                    </div>
                                    <div className="p-4 sm:p-6 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                                        <button onClick={() => setIsRedacaoModalOpen(false)} className="px-5 py-2.5 rounded-xl font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancelar</button>
                                        <button onClick={handleAddRedacao} className="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">Guardar Redação</button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</body>
</html>
