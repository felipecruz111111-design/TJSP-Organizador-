        const playBeep = () => {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = new AudioContextClass();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        };

                }
                return () => clearInterval(interval);

            const markDailyProgress = () => {
                const today = new Date().toISOString().split('T')[0];
                setStreak(prev => {
                    if (prev.lastDate === today) return prev;
                    if (prev.lastDate) {
                        const diffDays = Math.ceil((new Date(today) - new Date(prev.lastDate)) / (1000 * 60 * 60 * 24));
                        if (diffDays === 1) return { count: prev.count + 1, lastDate: today };
                        if (diffDays > 1) return { count: 1, lastDate: today };
                    }
                    return { count: 1, lastDate: today };
                });
            };

            const toggleSubjectDone = (dayId, subIdx) => {
                setDays(prev => prev.map(d => {
                    if (d.id !== dayId) return d;
                    const updatedSubs = [...d.subjects];
                    updatedSubs[subIdx] = { ...updatedSubs[subIdx], done: !updatedSubs[subIdx].done };
                    if (updatedSubs[subIdx].done) markDailyProgress();
                    return { ...d, subjects: updatedSubs };
                }));
            };

            const updateSubjectQuestions = (dayId, subIdx, field, val) => {
                const num = val === '' ? 0 : Math.max(0, parseInt(val, 10) || 0);
                setDays(prev => prev.map(d => {
                    if (d.id !== dayId) return d;
                    const updatedSubs = [...d.subjects];
                    const q = updatedSubs[subIdx].questions || { correct: 0, wrong: 0 };
                    updatedSubs[subIdx] = { ...updatedSubs[subIdx], questions: { ...q, [field]: num } };
                    return { ...d, subjects: updatedSubs };
                }));
            };

            const updatePendingNotes = (dayId, text) => {
                setDays(prev => prev.map(d => d.id === dayId ? { ...d, pendingNotes: text } : d));

                    const disc = { ...copy[discIdx] };
                    const topics = [...disc.topics];
                    topics[topicIdx] = { ...topics[topicIdx], [field]: !topics[topicIdx][field] };
                    disc.topics = topics;
                    copy[discIdx] = disc;

                markDailyProgress();

            // Simulados Adaptados
            const handleAddSimulado = () => {
                const cB1 = parseInt(newSimulado.correctB1, 10) || 0;
                const cB2 = parseInt(newSimulado.correctB2, 10) || 0;
                const cB3 = parseInt(newSimulado.correctB3, 10) || 0;
                const rNota = parseFloat(newSimulado.redacaoNota) || 0;

                const total = Number(newSimulado.bloco1) + Number(newSimulado.bloco2) + Number(newSimulado.bloco3);
                const totalCorrect = cB1 + cB2 + cB3;
                
                const eliminadob1 = cB1 < 8;
                const eliminadob2 = cB2 < 15;
                const reprovouRedacao = rNota < 24;

                const sim = {
                    id: Date.now(),
                    date: newSimulado.date,
                    total: total || 70,
                    correct: totalCorrect,
                    bloco1Acertos: cB1,
                    bloco2Acertos: cB2,
                    bloco3Acertos: cB3,
                    redacaoNota: rNota,
                    eliminado: eliminadob1 || eliminadob2 || reprovouRedacao,
                    time: newSimulado.time,
                    notes: newSimulado.notes

                    bloco3: 24,
