            const handleDeleteSimulado = (id) => {
                setSimulados(prev => prev.filter(s => s.id !== id));
                showToast("Simulado removido.");
            };

            const handleAddRedacao = () => {
                if (!newRedacao.theme.trim()) return showToast("Por favor, preencha o tema da redação.");
                setRedacoes(prev => [...prev, { ...newRedacao, id: Date.now() }]);
                setIsRedacaoModalOpen(false);
                setNewRedacao({ date: new Date().toISOString().split('T')[0], theme: '', time: '', status: 'planejada', notes: '' });
                showToast("Tema de redação cadastrado!");
            };

            const toggleRedacaoStatus = (id) => {
                setRedacoes(prev => prev.map(r => r.id === id ? { ...r, status: r.status === 'planejada' ? 'concluida' : 'planejada' } : r));
            };

            const handleDeleteRedacao = (id) => {
                setRedacoes(prev => prev.filter(r => r.id !== id));
                showToast("Redação removida.");
            };

            const exportBackup = () => {
                const data = { days, edital, simulados, redacoes, streak };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `backup_tjsp_duas_voltas_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Backup baixado com sucesso!");
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.days) setDays(parsed.days);
                        if (parsed.edital) setEdital(parsed.edital);
                        if (parsed.simulados) setSimulados(parsed.simulados);
                        if (parsed.redacoes) setRedacoes(parsed.redacoes);
                        if (parsed.streak) setStreak(parsed.streak);
                        showToast("Dados restaurados com sucesso!");
                    } catch (err) {
                        showToast("Arquivo de backup inválido.");
                    }
                };
                reader.readAsText(file);
            };

            // Métricas Globais e por Volta
            const stats = useMemo(() => {
                let totalTasks = 0;
                let doneTasks = 0;
                let fullDays = 0;
                let c1Total = 0;
                let c1Done = 0;
                let c2Total = 0;
                let c2Done = 0;
                let totalQuestions = 0;
                let totalCorrect = 0;
                const bySubject = {};

                days.forEach(d => {
                    let dayDone = 0;
                    d.subjects.forEach(s => {
                        totalTasks++;
                        if (d.cycle === 1) {
                            c1Total++;
                            if (s.done) c1Done++;
                        } else {
                            c2Total++;
                            if (s.done) c2Done++;
                        }

                        if (s.done) {
                            doneTasks++;
                            dayDone++;
                        }

                        if (s.questions) {
                            const c = s.questions.correct || 0;
                            const w = s.questions.wrong || 0;
                            totalCorrect += c;
                            totalQuestions += (c + w);
                            if (c > 0 || w > 0) {
                                if (!bySubject[s.name]) bySubject[s.name] = { name: s.name, Acertos: 0, Erros: 0, total: 0 };
                                bySubject[s.name].Acertos += c;
                                bySubject[s.name].Erros += w;
                                bySubject[s.name].total += (c + w);
                            }
                        }
                    });
                    if (d.subjects.length > 0 && dayDone === d.subjects.length) fullDays++;
                });

                const questionChartData = Object.values(bySubject).sort((a,b) => b.total - a.total);
                const globalAccuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
                const progressPct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                const c1Pct = c1Total > 0 ? Math.round((c1Done / c1Total) * 100) : 0;
                const c2Pct = c2Total > 0 ? Math.round((c2Done / c2Total) * 100) : 0;

                return { totalTasks, doneTasks, fullDays, c1Pct, c2Pct, totalQuestions, totalCorrect, globalAccuracy, progressPct, questionChartData };
            }, [days]);

            const editalProgress = useMemo(() => {
                let totalItems = 0;
                let completedChecks = 0;
                edital.forEach(d => {
                    d.topics.forEach(t => {
                        totalItems += 4;
                        if (t.teoria) completedChecks++;
                        if (t.lei) completedChecks++;
                        if (t.questoes) completedChecks++;
                        if (t.revisao) completedChecks++;
                    });
                });
                return totalItems > 0 ? Math.round((completedChecks / totalItems) * 100) : 0;
            }, [edital]);

            const pendingErrorsCount = useMemo(() => {
                return days.filter(d => d.pendingNotes && d.pendingNotes.trim() !== '' && !d.reviewScheduled).length;
            }, [days]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const filteredDays = useMemo(() => {
                let list = days;
                if (cycleFilter === '1') list = list.filter(d => d.cycle === 1);
                if (cycleFilter === '2') list = list.filter(d => d.cycle === 2);
                if (selectedWeekFilter !== 'Todas') list = list.filter(d => d.week === selectedWeekFilter);
                return list;
            }, [days, cycleFilter, selectedWeekFilter]);

            return (
                <div 
                    className="flex flex-col h-screen overflow-hidden relative"
                    style={{ 
                        backgroundImage: "url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg/1920px-Tribunal_de_Justi%C3%A7a_de_S%C3%A3o_Paulo.jpg')", 
                        backgroundSize: 'cover', 
                        backgroundPosition: 'center',
                        backgroundAttachment: 'fixed'
                    }}
                >
                    <div className="absolute inset-0 bg-slate-100/90 dark:bg-slate-950/92 backdrop-blur-[2px] z-0"></div>

                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-xl transition-all">
                            {toastMessage}
                        </div>
                    )}

                    <div className="relative z-10 flex flex-col h-full w-full">
                        {/* CABEÇALHO */}
                        <header className="flex justify-between items-center p-3 sm:p-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-b border-slate-200/60 dark:border-darkBorder/60 shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-base shadow-md">TJ</div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-sm sm:text-base font-bold text-slate-800 dark:text-white leading-tight">TJ-SP • 2 Voltas no Edital</h1>
                                        <span className="hidden lg:inline text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-400">1ª Volta: Teoria | 2ª Volta: Só Questões</span>
                                    </div>
                                    <p className="text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-1.5 mt-0.5">
                                        <Icons.Clock /> Prova prevista: <strong>14/03/2027</strong> • <span className="text-indigo-600 dark:text-indigo-400 font-bold">Faltam {daysUntilExam} dias</span>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 sm:gap-4">
                                {/* Pomodoro */}
                                <div className="flex items-center gap-2 bg-slate-100/90 dark:bg-slate-800/90 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700">
                                    <span className="font-mono text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 w-12 text-center">{formatTime(timeLeft)}</span>
                                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="text-slate-600 dark:text-slate-300 hover:text-indigo-600">
                                        {isTimerRunning ? <Icons.Pause /> : <Icons.Play />}
                                    </button>
                                    <button onClick={() => { setIsTimerRunning(false); setTimeLeft(pomodoroMode === 'study' ? 50 * 60 : 10 * 60); }} className="text-slate-400 hover:text-rose-500">
                                        <Icons.Refresh />
                                    </button>
                                </div>

                                {/* Streak */}
                                <div className="flex items-center gap-1 text-amber-500 font-extrabold text-xs sm:text-sm" title="Dias consecutivos estudando">
                                    <Icons.Flame />
                                    <span>{streak.count}</span>
                                </div>

                                {/* Dark Mode */}
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200">
                                    {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </header>

                        <div className="flex flex-1 overflow-hidden">
                            {/* SIDEBAR DESKTOP */}
                            <aside className="w-64 bg-white/70 dark:bg-darkCard/70 backdrop-blur-md border-r border-slate-200/60 dark:border-darkBorder/60 hidden md:flex flex-col">
                                <nav className="flex-1 p-3 space-y-1.5 overflow-y-auto custom-scrollbar">
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <Icons.Dashboard /> Visão Geral
                                    </button>
                                    <button onClick={() => setActiveTab('cronograma')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'cronograma' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <Icons.Calendar /> Cronograma (132d)
                                    </button>
                                    <button onClick={() => setActiveTab('edital')} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'edital' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <div className="flex items-center gap-3">
                                            <Icons.CheckList /> Edital Verticalizado
                                        </div>
                                        <span className="text-[11px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300">{editalProgress}%</span>
                                    </button>
                                    <button onClick={() => setActiveTab('revisoes')} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'revisoes' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <div className="flex items-center gap-3">
                                            <Icons.BookOpen /> Caderno de Erros
                                        </div>
                                        {pendingErrorsCount > 0 && (
                                            <span className="text-[11px] font-bold px-1.5 py-0.5 rounded bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300">{pendingErrorsCount}</span>
                                        )}
                                    </button>
                                    <button onClick={() => setActiveTab('simulados')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'simulados' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <Icons.Clipboard /> Simulados (70q)
                                    </button>
                                    <button onClick={() => setActiveTab('redacoes')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${activeTab === 'redacoes' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800'}`}>
                                        <Icons.Pen /> Redações (40 pts)
                                    </button>
                                </nav>

                                {/* PROGRESSO DAS 2 VOLTAS */}
                                <div className="p-4 border-t border-slate-200/60 dark:border-darkBorder/60 space-y-3">
                                    <div className="bg-slate-100 dark:bg-slate-800/60 rounded-xl p-2.5 text-xs">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="font-bold text-slate-700 dark:text-slate-200">1ª Volta (Teoria)</span>
                                            <span className="font-extrabold text-indigo-600 dark:text-indigo-400">{stats.c1Pct}%</span>
                                        </div>
                                        <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                            <div className="bg-indigo-600 h-full rounded-full transition-all" style={{ width: `${stats.c1Pct}%` }}></div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-100 dark:bg-slate-800/60 rounded-xl p-2.5 text-xs">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="font-bold text-slate-700 dark:text-slate-200">2ª Volta (Só Questões)</span>
                                            <span className="font-extrabold text-purple-600 dark:text-purple-400">{stats.c2Pct}%</span>
                                        </div>
                                        <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                            <div className="bg-purple-600 h-full rounded-full transition-all" style={{ width: `${stats.c2Pct}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            </aside>

                            {/* NAVBAR MOBILE */}
                            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-darkCard/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex justify-around p-1.5 z-40">
                                <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-1 ${activeTab === 'dashboard' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.Dashboard />
                                    <span className="text-[9px]">Geral</span>
                                </button>
                                <button onClick={() => setActiveTab('cronograma')} className={`flex flex-col items-center p-1 ${activeTab === 'cronograma' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.Calendar />
                                    <span className="text-[9px]">132 Dias</span>
                                </button>
                                <button onClick={() => setActiveTab('edital')} className={`flex flex-col items-center p-1 ${activeTab === 'edital' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.CheckList />
                                    <span className="text-[9px]">Edital</span>
                                </button>
                                <button onClick={() => setActiveTab('revisoes')} className={`flex flex-col items-center p-1 relative ${activeTab === 'revisoes' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.BookOpen />
                                    <span className="text-[9px]">Erros</span>
                                    {pendingErrorsCount > 0 && (
                                        <span className="absolute top-0 right-1 w-2 h-2 rounded-full bg-rose-500"></span>
                                    )}
                                </button>
                                <button onClick={() => setActiveTab('simulados')} className={`flex flex-col items-center p-1 ${activeTab === 'simulados' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.Clipboard />
                                    <span className="text-[9px]">Simulados</span>
                                </button>
                                <button onClick={() => setActiveTab('redacoes')} className={`flex flex-col items-center p-1 ${activeTab === 'redacoes' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}>
                                    <Icons.Pen />
                                    <span className="text-[9px]">Redação</span>
                                </button>
                            </div>

                            {/* ÁREA PRINCIPAL */}
                            <main className="flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-6 pb-24 md:pb-6">
                                
                                {/* 1. ABA DASHBOARD */}
                                {activeTab === 'dashboard' && (
                                    <div className="max-w-6xl mx-auto space-y-6">
                                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3">
                                            <div>
                                                <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Evolução do Estudante 🎯</h2>
                                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Plano Estratégico: 1ª Volta (Teoria + Módulos) e 2ª Volta (Bateria Intensiva de Questões).</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={exportBackup} className="flex items-center gap-1.5 px-3 py-1.5 bg-white dark:bg-darkCard border border-slate-200 dark:border-darkBorder rounded-xl text-xs font-bold hover:bg-slate-50">
                                                    <Icons.Download /> Backup
                                                </button>
                                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1.5 px-3 py-1.5 bg-white dark:bg-darkCard border border-slate-200 dark:border-darkBorder rounded-xl text-xs font-bold hover:bg-slate-50">
                                                    <Icons.Upload /> Restaurar
                                                </button>
                                                <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
                                            </div>
                                        </header>

                                        {/* BANNER 2 VOLTAS */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="bg-indigo-50/90 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 rounded-2xl p-4 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-black uppercase text-indigo-700 dark:text-indigo-300">1ª Volta: Teoria & Módulos</span>
                                                        <span className="text-xs font-extrabold text-indigo-600 bg-white dark:bg-indigo-900/60 px-2 py-0.5 rounded-lg">{stats.c1Pct}%</span>
                                                    </div>
                                                    <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">
                                                        Dias 1 a 66: Construção de base com apostilas, videoaulas e primeiras questões de fixação.
                                                    </p>
                                                </div>
                                                <div className="w-full bg-indigo-200 dark:bg-indigo-900/80 rounded-full h-2 mt-3 overflow-hidden">
                                                    <div className="bg-indigo-600 h-full rounded-full transition-all" style={{ width: `${stats.c1Pct}%` }}></div>
                                                </div>
                                            </div>

                                            <div className="bg-purple-50/90 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-900 rounded-2xl p-4 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-black uppercase text-purple-700 dark:text-purple-300">2ª Volta: 100% Questões VUNESP</span>
                                                        <span className="text-xs font-extrabold text-purple-600 bg-white dark:bg-purple-900/60 px-2 py-0.5 rounded-lg">{stats.c2Pct}%</span>
                                                    </div>
                                                    <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">
                                                        Dias 67 a 132: Reta final focada em baterias massivas de questões e aparo de arestas nos erros.
                                                    </p>
                                                </div>
                                                <div className="w-full bg-purple-200 dark:bg-purple-900/80 rounded-full h-2 mt-3 overflow-hidden">
                                                    <div className="bg-purple-600 h-full rounded-full transition-all" style={{ width: `${stats.c2Pct}%` }}></div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* CARDS INDICADORES */}
                                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                                            <div className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-100 dark:border-darkBorder shadow-sm">
                                                <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Dias Totais Fechados</p>
                                                <p className="text-xl sm:text-2xl font-black text-indigo-600 mt-1">{stats.fullDays} <span className="text-xs font-normal text-slate-400">/ 132</span></p>
                                            </div>
                                            <div className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-100 dark:border-darkBorder shadow-sm">
                                                <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Metas Cumpridas</p>
                                                <p className="text-xl sm:text-2xl font-black text-emerald-600 mt-1">{stats.doneTasks} <span className="text-xs font-normal text-slate-400">/ {stats.totalTasks}</span></p>
                                            </div>
                                            <div className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-100 dark:border-darkBorder shadow-sm">
                                                <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Questões Treinadas</p>
                                                <p className="text-xl sm:text-2xl font-black text-amber-500 mt-1">{stats.totalQuestions} <span className="text-xs font-normal text-slate-400">feitas</span></p>
                                            </div>
                                            <div className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-100 dark:border-darkBorder shadow-sm">
                                                <p className="text-xs font-semibold text-slate-500 dark:text-slate-400">Aproveitamento Médio</p>
                                                <p className="text-xl sm:text-2xl font-black text-rose-500 mt-1">{stats.globalAccuracy}% <span className="text-xs font-normal text-slate-400">acertos</span></p>
                                            </div>
                                        </div>

                                        {/* GRÁFICO DE QUESTÕES POR DISCIPLINA */}
                                        <div className="bg-white/90 dark:bg-darkCard/90 p-5 rounded-2xl border border-slate-100 dark:border-darkBorder shadow-sm">
                                            <h3 className="text-sm sm:text-base font-bold text-slate-800 dark:text-white mb-1">Acertos vs Erros por Disciplina</h3>
                                            <p className="text-xs text-slate-500 mb-4">Contabilizado a partir das questões anotadas nos dias do cronograma.</p>
                                            
                                            {stats.questionChartData.length > 0 ? (
                                                <div className="h-64 sm:h-72">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <BarChart data={stats.questionChartData} margin={{ top: 10, right: 10, left: -20, bottom: 20 }}>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} opacity={0.3} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                                                            <XAxis dataKey="name" tick={{ fontSize: 10, fill: isDarkMode ? '#cbd5e1' : '#475569' }} interval={0} angle={-25} textAnchor="end" stroke={isDarkMode ? '#64748b' : '#94a3b8'} />
                                                            <YAxis tick={{ fontSize: 11, fill: isDarkMode ? '#cbd5e1' : '#475569' }} stroke={isDarkMode ? '#64748b' : '#94a3b8'} />
                                                            <Tooltip contentStyle={{ backgroundColor: isDarkMode ? '#1e293b' : '#fff', borderRadius: '12px', border: 'none', color: isDarkMode ? '#f8fafc' : '#0f172a', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                                            <Legend wrapperStyle={{ paddingTop: '10px', fontSize: '12px' }} />
                                                            <Bar dataKey="Acertos" fill="#10b981" radius={[4, 4, 0, 0]} />
                                                            <Bar dataKey="Erros" fill="#ef4444" radius={[4, 4, 0, 0]} />
                                                        </BarChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            ) : (
                                                <div className="h-44 flex flex-col items-center justify-center text-center opacity-60">
                                                    <Icons.Target />
                                                    <p className="text-xs text-slate-500 mt-2">Nenhuma questão anotada ainda.<br/>Abra um dia no cronograma e preencha seus acertos e erros!</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* 2. ABA CRONOGRAMA */}
                                {activeTab === 'cronograma' && (
                                    <div className="max-w-6xl mx-auto space-y-4">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div>
                                                <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Cronograma das 2 Voltas</h2>
                                                <p className="text-xs text-slate-500">1ª Volta (Dias 1 a 66 - Teoria) e 2ª Volta (Dias 67 a 132 - Só Questões VUNESP).</p>
                                            </div>

                                            {/* FILTRO DE VOLTAS */}
                                            <div className="flex bg-slate-200/80 dark:bg-slate-800 p-1 rounded-xl gap-1 shrink-0">
                                                <button 
                                                    onClick={() => setCycleFilter('all')} 
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${cycleFilter === 'all' ? 'bg-white dark:bg-darkCard text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                                >
                                                    Todas (132d)
                                                </button>
                                                <button 
                                                    onClick={() => setCycleFilter('1')} 
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${cycleFilter === '1' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-indigo-600'}`}
                                                >
                                                    1ª Volta (Teoria)
                                                </button>
                                                <button 
                                                    onClick={() => setCycleFilter('2')} 
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${cycleFilter === '2' ? 'bg-purple-600 text-white shadow-sm' : 'text-slate-500 hover:text-purple-600'}`}
                                                >
                                                    ⚡ 2ª Volta (Só Questões)
                                                </button>
                                            </div>
                                        </div>

                                        {/* Filtro de Semanas */}
                                        <div className="flex gap-1.5 overflow-x-auto w-full py-1 custom-scrollbar">
                                            {['Todas', 'Semana 1', 'Semana 2', 'Semana 3', 'Semana 4', 'Semana 5', 'Semana 6', 'Semana 7', 'Semana 8', 'Semana 9', 'Semana 10', 'Semana 11'].map(w => (
                                                <button
                                                    key={w}
                                                    onClick={() => setSelectedWeekFilter(w)}
                                                    className={`px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap transition-colors ${selectedWeekFilter === w ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900' : 'bg-white/80 dark:bg-darkCard/80 text-slate-600 dark:text-slate-300'}`}
                                                >
                                                    {w}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                            {filteredDays.map(d => {
                                                const total = d.subjects.length;
                                                const done = d.subjects.filter(s => s.done).length;
                                                const isCompleted = total > 0 && done === total;
                                                const hasPendingNotes = d.pendingNotes && d.pendingNotes.trim() !== '' && !d.reviewScheduled;
                                                const isCycle2 = d.cycle === 2;

                                                return (
                                                    <div 
                                                        key={d.id}
                                                        onClick={() => setSelectedDayId(d.id)}
                                                        className={`p-3.5 rounded-2xl border cursor-pointer transition-all hover:scale-[1.02] flex flex-col justify-between h-28 relative ${
                                                            isCompleted 
                                                                ? 'bg-emerald-500/10 border-emerald-500/30' 
                                                                : isCycle2 
                                                                    ? 'bg-purple-50/70 dark:bg-purple-950/20 border-purple-200/80 dark:border-purple-900/50' 
                                                                    : 'bg-white/90 dark:bg-darkCard/90 border-slate-200/80 dark:border-darkBorder/80'
                                                        }`}
                                                    >
                                                        {hasPendingNotes && (
                                                            <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                                                        )}
                                                        <div className="flex justify-between items-start">
                                                            <span className={`text-[10px] font-extrabold uppercase ${isCycle2 ? 'text-purple-600 dark:text-purple-400' : 'text-indigo-600 dark:text-indigo-400'}`}>
                                                                {isCycle2 ? '⚡ 2ª Volta' : d.week}
                                                            </span>
                                                            <span className="text-[10px] text-slate-400 font-medium">{d.dayOfWeek}</span>
                                                        </div>
                                                        <div className="my-auto text-center">
                                                            <span className="text-2xl font-black text-slate-800 dark:text-white">Dia {d.id}</span>
                                                        </div>
                                                        <div>
                                                            <div className="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                                                <div className={`${isCycle2 ? 'bg-purple-600' : 'bg-indigo-600'} h-full rounded-full transition-all`} style={{ width: `${total > 0 ? (done / total) * 100 : 0}%` }}></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* 3. ABA EDITAL VERTICALIZADO (ANEXO VIII COMPLETO) */}
                                {activeTab === 'edital' && (
                                    <div className="max-w-5xl mx-auto space-y-5">
                                        <div>
                                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Edital Verticalizado TJ-SP 📋</h2>
                                            <p className="text-xs text-slate-500">Conteúdo Programático Oficial do Edital 02/2026. Controle Teoria, Lei Seca, Questões e Revisões.</p>
                                        </div>

                                        <div className="space-y-4">
                                            {edital.map((disc, discIdx) => (
                                                <div key={disc.discipline} className="bg-white/90 dark:bg-darkCard/90 rounded-2xl border border-slate-200 dark:border-darkBorder p-4 shadow-sm">
                                                    <h3 className="font-extrabold text-sm sm:text-base text-indigo-600 dark:text-indigo-400 mb-3">{disc.discipline}</h3>
                                                    <div className="space-y-2.5">
                                                        {disc.topics.map((top, topIdx) => (
                                                            <div key={top.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-2.5 rounded-xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 gap-2">
                                                                <span className="text-xs font-semibold text-slate-700 dark:text-slate-200 flex-1">{top.name}</span>
                                                                <div className="flex gap-2 shrink-0">
                                                                    {[
                                                                        { key: 'teoria', label: 'Teoria' },
                                                                        { key: 'lei', label: 'Lei Seca' },
                                                                        { key: 'questoes', label: 'Questões' },
                                                                        { key: 'revisao', label: 'Revisão' }
                                                                    ].map(badge => (
                                                                        <button
                                                                            key={badge.key}
                                                                            onClick={() => toggleEditalCheck(discIdx, topIdx, badge.key)}
                                                                            className={`px-2 py-1 rounded-lg text-[10px] font-bold transition-all ${top[badge.key] ? 'bg-emerald-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
                                                                        >
                                                                            {badge.label} {top[badge.key] ? '✓' : ''}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 4. ABA CADERNO DE ERROS */}
                                {activeTab === 'revisoes' && (
                                    <div className="max-w-4xl mx-auto space-y-4">
                                        <div>
                                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Caderno de Erros & Dúvidas 🧠</h2>
                                            <p className="text-xs text-slate-500">Anotações de dificuldades e tópicos críticos para não errar na prova.</p>
                                        </div>

                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">
                                                <Icons.Search />
                                            </div>
                                            <input 
                                                type="text" 
                                                placeholder="Filtrar por matéria ou palavra-chave..." 
                                                className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-darkBorder bg-white/90 dark:bg-darkCard/90 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                                value={searchErrorQuery}
                                                onChange={e => setSearchErrorQuery(e.target.value)}
                                            />
                                        </div>

                                        <div className="space-y-3">
                                            {days.filter(d => d.pendingNotes && d.pendingNotes.trim() !== '')
                                                .filter(d => d.pendingNotes.toLowerCase().includes(searchErrorQuery.toLowerCase()) || d.subjects.some(s => s.name.toLowerCase().includes(searchErrorQuery.toLowerCase())))
                                                .map(d => (
                                                    <div key={d.id} className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm space-y-2">
                                                        <div className="flex justify-between items-center">
                                                            <div>
                                                                <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">Dia {d.id} • {d.cycleLabel} ({d.dayOfWeek})</span>
                                                                <p className="text-[11px] text-slate-400">{d.subjects.map(s => s.name).join(', ')}</p>
                                                            </div>
                                                            <button 
                                                                onClick={() => toggleReviewScheduled(d.id)}
                                                                className={`px-3 py-1 rounded-xl text-xs font-bold transition-colors ${d.reviewScheduled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-400'}`}
                                                            >
                                                                {d.reviewScheduled ? 'Revisado ✓' : 'Pendente'}
                                                            </button>
                                                        </div>
                                                        <p className="text-xs sm:text-sm bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800 text-slate-700 dark:text-slate-200 whitespace-pre-wrap">{d.pendingNotes}</p>
                                                    </div>
                                                ))}
                                        </div>
                                    </div>
                                )}

                                {/* 5. ABA SIMULADOS */}
                                {activeTab === 'simulados' && (
                                    <div className="max-w-5xl mx-auto space-y-5">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Simulados Oficiais (70 Questões) 📝</h2>
                                                <p className="text-xs text-slate-500">Diagnóstico rigoroso por Bloco e Redação conforme o Edital nº 02/2026.</p>
                                            </div>
                                            <button onClick={() => setIsSimuladoModalOpen(true)} className="flex items-center gap-1.5 px-3.5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 shadow-sm">
                                                <Icons.Plus /> Registrar Simulado
                                            </button>
                                        </div>

                                        {simulados.length > 0 && (
                                            <div className="bg-white/90 dark:bg-darkCard/90 p-5 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm">
                                                <h3 className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Evolução do Aproveitamento Geral (%)</h3>
                                                <div className="h-56 sm:h-64">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <LineChart data={simulados.map((s, idx) => ({ name: `Sim ${idx + 1}`, perc: s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0 }))}>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} opacity={0.3} stroke={isDarkMode ? '#334155' : '#e2e8f0'} />
                                                            <XAxis dataKey="name" tick={{ fontSize: 11, fill: isDarkMode ? '#cbd5e1' : '#475569' }} stroke={isDarkMode ? '#64748b' : '#94a3b8'} />
                                                            <YAxis domain={[0, 100]} tick={{ fontSize: 11, fill: isDarkMode ? '#cbd5e1' : '#475569' }} stroke={isDarkMode ? '#64748b' : '#94a3b8'} />
                                                            <Tooltip formatter={val => `${val}%`} contentStyle={{ backgroundColor: isDarkMode ? '#1e293b' : '#fff', borderRadius: '12px', border: 'none', color: isDarkMode ? '#f8fafc' : '#0f172a' }} />
                                                            <Line type="monotone" dataKey="perc" name="Aproveitamento" stroke="#4f46e5" strokeWidth={3} dot={{ r: 5 }} />
                                                        </LineChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {simulados.map(sim => {
                                                const pct = sim.total > 0 ? Math.round((sim.correct / sim.total) * 100) : 0;
                                                return (
                                                    <div key={sim.id} className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex justify-between items-start">
                                                                <span className="text-xs font-bold text-indigo-600">{formatDateBR(sim.date)}</span>
                                                                <button onClick={() => handleDeleteSimulado(sim.id)} className="text-slate-400 hover:text-rose-500" title="Excluir simulado">
                                                                    <Icons.Trash />
                                                                </button>
                                                            </div>

                                                            <div className="mt-2 flex items-center justify-between">
                                                                <span className="text-2xl font-black text-slate-800 dark:text-white">{sim.correct} <span className="text-xs font-normal text-slate-400">/ {sim.total}</span></span>
                                                                <span className={`text-xs font-extrabold px-2 py-0.5 rounded-lg ${pct >= 75 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{pct}%</span>
                                                            </div>

                                                            {/* DIAGNÓSTICO POR BLOCO */}
                                                            <div className="mt-3 space-y-1.5 text-[11px] bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                                                                <div className="flex justify-between">
                                                                    <span>Bloco I (Português):</span>
                                                                    <strong className={sim.bloco1Acertos < 8 ? "text-rose-500" : "text-emerald-600"}>{sim.bloco1Acertos}/16 {sim.bloco1Acertos < 8 ? "⚠️ Eliminado" : "✓"}</strong>
                                                                </div>
                                                                <div className="flex justify-between">
                                                                    <span>Bloco II (Direito):</span>
                                                                    <strong className={sim.bloco2Acertos < 15 ? "text-rose-500" : "text-emerald-600"}>{sim.bloco2Acertos}/30 {sim.bloco2Acertos < 15 ? "⚠️ Eliminado" : "✓"}</strong>
                                                                </div>
                                                                <div className="flex justify-between">
                                                                    <span>Bloco III (Gerais):</span>
                                                                    <strong>{sim.bloco3Acertos}/24</strong>
                                                                </div>
                                                                <div className="flex justify-between border-t border-slate-200/50 dark:border-slate-700/50 pt-1">
                                                                    <span>Redação (0 a 40):</span>
                                                                    <strong className={sim.redacaoNota < 24 ? "text-rose-500" : "text-indigo-600"}>{sim.redacaoNota} pts {sim.redacaoNota < 24 ? "⚠️ < 24" : "✓"}</strong>
                                                                </div>
                                                            </div>

                                                            {sim.time && <p className="text-[11px] text-slate-400 mt-2">Tempo de Prova: {sim.time}</p>}
                                                            {sim.notes && <p className="text-xs text-slate-600 dark:text-slate-300 mt-2 bg-slate-50 dark:bg-slate-800/40 p-2 rounded-xl italic">"{sim.notes}"</p>}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* 6. ABA REDAÇÕES */}
                                {activeTab === 'redacoes' && (
                                    <div className="max-w-5xl mx-auto space-y-5">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h2 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white">Redações VUNESP (0 a 40 pts) ✍️</h2>
                                                <p className="text-xs text-slate-500">Mínimo para aprovação: 24 pontos (ou 19,2 em cotas). Texto dissertativo-argumentativo autoral.</p>
                                            </div>
                                            <button onClick={() => setIsRedacaoModalOpen(true)} className="flex items-center gap-1.5 px-3.5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 shadow-sm">
                                                <Icons.Plus /> Novo Tema
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {redacoes.map(red => (
                                                <div key={red.id} className="bg-white/90 dark:bg-darkCard/90 p-4 rounded-2xl border border-slate-200 dark:border-darkBorder shadow-sm flex flex-col justify-between">
                                                    <div>
                                                        <div className="flex justify-between items-start gap-2">
                                                            <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-lg ${red.status === 'concluida' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{red.status}</span>
                                                            <button onClick={() => handleDeleteRedacao(red.id)} className="text-slate-400 hover:text-rose-500" title="Excluir redação">
                                                                <Icons.Trash />
                                                            </button>
                                                        </div>
                                                        <h3 className="font-bold text-sm text-slate-800 dark:text-white mt-2 leading-snug">{red.theme}</h3>
                                                        <p className="text-[11px] text-slate-400 mt-1">Data: {formatDateBR(red.date)} {red.time ? `• Tempo: ${red.time}` : ''}</p>
                                                        {red.notes && <p className="text-xs text-slate-600 dark:text-slate-300 mt-2 bg-slate-50 dark:bg-slate-800/40 p-2 rounded-xl italic">"{red.notes}"</p>}
                                                    </div>
                                                    <button 
                                                        onClick={() => toggleRedacaoStatus(red.id)}
                                                        className={`mt-4 w-full py-1.5 rounded-xl text-xs font-bold transition-colors ${red.status === 'concluida' ? 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                                                    >
                                                        {red.status === 'concluida' ? 'Desmarcar' : 'Concluir Redação ✓'}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </main>
                        </div>
                    </div>

                    {/* MODAL METAS DO DIA */}
                    {selectedDayId !== null && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-slate-200 dark:border-darkBorder">
                                {(() => {
                                    const day = days.find(d => d.id === selectedDayId);
                                    if (!day) return null;
                                    const isCycle2 = day.cycle === 2;

                                    return (
                                        <>
                                            <div className={`p-4 border-b border-slate-100 dark:border-darkBorder flex justify-between items-center ${isCycle2 ? 'bg-purple-50/80 dark:bg-purple-950/40' : 'bg-slate-50/80 dark:bg-slate-800/40'}`}>
                                                <div>
                                                    <span className={`text-[11px] font-extrabold uppercase ${isCycle2 ? 'text-purple-600 dark:text-purple-400' : 'text-indigo-600 dark:text-indigo-400'}`}>
                                                        {day.cycleLabel} • {day.week} ({day.dayOfWeek})
                                                    </span>
                                                    <h3 className="text-lg font-black text-slate-800 dark:text-white">Metas do Dia {day.id}</h3>
                                                </div>
                                                <button onClick={() => setSelectedDayId(null)} className="p-1 rounded-lg text-slate-400 hover:text-slate-700">✕</button>
                                            </div>

                                            <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                                                {isCycle2 && (
                                                    <div className="bg-purple-100/70 dark:bg-purple-900/30 border border-purple-200 dark:border-purple-800 p-2.5 rounded-xl flex items-center gap-2 text-xs text-purple-800 dark:text-purple-200 font-semibold">
                                                        <Icons.Zap /> 2ª Volta focada exclusivamente em Bateria de Questões VUNESP dos assuntos indicados!
                                                    </div>
                                                )}

                                                <div className="space-y-3">
                                                    {day.subjects.map((sub, sIdx) => {
                                                        const q = sub.questions || { correct: 0, wrong: 0 };
                                                        const totalQ = q.correct + q.wrong;
                                                        const pctQ = totalQ > 0 ? Math.round((q.correct / totalQ) * 100) : null;

                                                        return (
                                                            <div key={sIdx} className="p-3 rounded-xl border border-slate-200/80 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/40 space-y-2">
                                                                <div className="flex items-start gap-2.5 cursor-pointer" onClick={() => toggleSubjectDone(day.id, sIdx)}>
                                                                    <div className={`w-5 h-5 rounded-md flex items-center justify-center border mt-0.5 shrink-0 transition-colors ${sub.done ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 dark:border-slate-600'}`}>
                                                                        {sub.done && <Icons.Check />}
                                                                    </div>
                                                                    <div>
                                                                        <p className={`text-xs sm:text-sm font-bold ${sub.done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-white'}`}>{sub.name}</p>
                                                                        <p className="text-[11px] text-slate-500 leading-snug">{sub.topic}</p>
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center gap-3 pt-1 border-t border-slate-200/50 dark:border-slate-700/50">
                                                                    <span className="text-[11px] font-bold text-slate-400">Questões:</span>
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="text-[10px] text-emerald-600 font-bold">✓</span>
                                                                        <input 
                                                                            type="number" 
                                                                            placeholder="0" 
                                                                            value={q.correct || ''}
                                                                            onChange={e => updateSubjectQuestions(day.id, sIdx, 'correct', e.target.value)}
                                                                            className="w-12 px-1.5 py-0.5 text-center text-xs rounded bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 outline-none"
                                                                        />
                                                                    </div>
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="text-[10px] text-rose-500 font-bold">✗</span>
                                                                        <input 
                                                                            type="number" 
                                                                            placeholder="0" 
                                                                            value={q.wrong || ''}
                                                                            onChange={e => updateSubjectQuestions(day.id, sIdx, 'wrong', e.target.value)}
                                                                            className="w-12 px-1.5 py-0.5 text-center text-xs rounded bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 outline-none"
                                                                        />
                                                                    </div>
                                                                    {pctQ !== null && (
                                                                        <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-300 ml-auto">{pctQ}%</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Dificuldades / Caderno de Erros deste dia:</label>
                                                    <textarea 
                                                        rows="3" 
                                                        value={day.pendingNotes} 
                                                        onChange={e => updatePendingNotes(day.id, e.target.value)}
                                                        placeholder="Ex: Errei questões de impedimento e suspeição..." 
                                                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-darkBorder bg-slate-50 dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                                                    />
                                                </div>
                                            </div>

                                            <div className="p-3 border-t border-slate-100 dark:border-darkBorder flex justify-end bg-slate-50/80 dark:bg-slate-800/40">
                                                <button onClick={() => setSelectedDayId(null)} className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">Fechar</button>
                                            </div>
                                        </>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* MODAL SIMULADO */}
                    {isSimuladoModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-slate-200 dark:border-darkBorder max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <h3 className="text-base font-black text-slate-800 dark:text-white">Registrar Simulado (Edital 02/2026)</h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Data</label>
                                        <input type="date" value={newSimulado.date} onChange={e => setNewSimulado({...newSimulado, date: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none" />
                                    </div>

                                    {/* BLOCOS DO EDITAL */}
                                    <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                                        <span className="text-[11px] font-black uppercase text-indigo-600 dark:text-indigo-400">Acertos por Bloco (Mínimo de 50%)</span>
                                        
                                        <div className="grid grid-cols-3 gap-2">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300">Bloco I (Português)</label>
                                                <input type="number" min="0" max="16" placeholder="de 16" value={newSimulado.correctB1} onChange={e => setNewSimulado({...newSimulado, correctB1: e.target.value})} className="w-full p-1.5 text-xs text-center rounded-lg border font-bold" />
                                                <span className="text-[9px] text-slate-400">mín. 8 acertos</span>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300">Bloco II (Direito)</label>
                                                <input type="number" min="0" max="30" placeholder="de 30" value={newSimulado.correctB2} onChange={e => setNewSimulado({...newSimulado, correctB2: e.target.value})} className="w-full p-1.5 text-xs text-center rounded-lg border font-bold" />
                                                <span className="text-[9px] text-slate-400">mín. 15 acertos</span>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300">Bloco III (Gerais)</label>
                                                <input type="number" min="0" max="24" placeholder="de 24" value={newSimulado.correctB3} onChange={e => setNewSimulado({...newSimulado, correctB3: e.target.value})} className="w-full p-1.5 text-xs text-center rounded-lg border font-bold" />
                                                <span className="text-[9px] text-slate-400">classificatório</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* REDAÇÃO */}
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Nota da Redação (0 a 40)</label>
                                            <input type="number" min="0" max="40" placeholder="Ex: 32" value={newSimulado.redacaoNota} onChange={e => setNewSimulado({...newSimulado, redacaoNota: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none font-bold" />
                                            <span className="text-[10px] text-slate-400">mín. 24 pts (19,2 cotas)</span>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Tempo Total</label>
                                            <input type="text" placeholder="Ex: 4h 30min" value={newSimulado.time} onChange={e => setNewSimulado({...newSimulado, time: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none" />
                                            <span className="text-[10px] text-slate-400">máximo de 5 horas</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Observações da Prova</label>
                                        <textarea rows="2" placeholder="Ex: Preciso controlar melhor o tempo da redação..." value={newSimulado.notes} onChange={e => setNewSimulado({...newSimulado, notes: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none resize-none" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setIsSimuladoModalOpen(false)} className="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                                    <button onClick={handleAddSimulado} className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700">Salvar Simulado</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL REDAÇÃO */}
                    {isRedacaoModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-darkCard rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-slate-200 dark:border-darkBorder">
                                <h3 className="text-base font-black text-slate-800 dark:text-white">Adicionar Tema de Redação</h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Tema Proposto (VUNESP)</label>
                                        <input type="text" placeholder="Ex: O envelhecimento populacional e os desafios do cuidado..." value={newRedacao.theme} onChange={e => setNewRedacao({...newRedacao, theme: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Data</label>
                                            <input type="date" value={newRedacao.date} onChange={e => setNewRedacao({...newRedacao, date: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Tempo Gasto</label>
                                            <input type="text" placeholder="Ex: 1h 15min" value={newRedacao.time} onChange={e => setNewRedacao({...newRedacao, time: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Argumentos e Tese</label>
                                        <textarea rows="3" placeholder="Repertórios utilizados, filósofos, tese e tópicos..." value={newRedacao.notes} onChange={e => setNewRedacao({...newRedacao, notes: e.target.value})} className="w-full p-2 text-xs rounded-xl border bg-slate-50 dark:bg-slate-800 dark:border-darkBorder outline-none resize-none" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setIsRedacaoModalOpen(false)} className="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                                    <button onClick={handleAddRedacao} className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700">Salvar Tema</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
